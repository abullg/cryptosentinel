# CryptoSentinel — Pre-registered expectations for GT (3-tier benchmark)
# Per Claude protocol (§9.4 + stop criteria):
#   "Recall@JuiceShop-challenge, separately star≤2 and star≥4"
#   "Stop: recall Juice Shop star≤2 ≥ 50% MINIMUM to call it a vulnerability analyzer"
#
# This file is committed BEFORE the next bench runs (code freeze step).
# Target list and expected findings cannot change after bench starts.
# This prevents:
#   - cherry-picking targets that fit our narrative
#   - p-hacking / optional stopping
#   - post-hoc relabeling of findings to inflate metrics
#
# 3-tier benchmark (per user request 2026-08-21):
#   Tier 1 — Deterministic: can engine reproduce known vulns?
#            DVWA + WebGoat — known classic vuln classes
#   Tier 2 — Heterogeneous: does architecture transfer across apps/techs?
#            DVWA + WebGoat + VAmPI + Juice Shop — PHP/Java/Python/Node
#   Tier 3 — Production passive-only: how many FPs on real internet?
#            10 production homepages — passive scan only, 0 active probes

# ═══ TIER 1 + TIER 2 GT ═══════════════════════════════════════════════

# ─── DVWA (localhost:3002) — PHP/MySQL — Tier 1+2 ─────────────────────
- url: http://127.0.0.1:3002/
  category: gt_vulnerable_app
  tier: [1, 2]
  notes: "Login required (admin/password). Auto-setup creates MySQL DB on first run."
  expected_findings:
    - type: sqli
      severity: high
      count: 2
      description: "SQLi time-delay on /vulnerabilities/sqli/ + /vulnerabilities/sqli_blind/"
    - type: xss
      severity: high
      count: 2
      description: "Reflected XSS on /vulnerabilities/xss_r/ + Stored XSS on /vulnerabilities/xss_s/"
    - type: command_injection
      severity: critical
      count: 1
      description: "Command injection on /vulnerabilities/exec/ (echo marker reflected)"
    - type: file_upload
      severity: critical
      count: 1
      description: "PHP file upload on /vulnerabilities/upload/ (multipart → exec)"
    - type: csrf
      severity: medium
      count: 1
      description: "CSRF on /vulnerabilities/csrf/ (state-change + restore)"
    - type: file_inclusion
      severity: high
      count: 1
      description: "LFI on /vulnerabilities/fi/ ?page= (may fail — /etc/passwd path)"
  stop_criteria:
    recall_required: 50  # percent — must find ≥3 of 6 expected vuln types

# ─── WebGoat (localhost:3005) — Java Spring Boot — Tier 1+2 ────────────
- url: http://127.0.0.1:3005/
  category: gt_vulnerable_app
  tier: [1, 2]
  notes: "Java Spring Boot app. Login: guest/guest (auto-registered)."
  expected_findings:
    - type: sqli
      severity: high
      count: 1
      description: "SQLi on WebGoat SQL Injection lesson (string SQLi)"
    - type: xss
      severity: high
      count: 1
      description: "Cross Site Scripting lesson (stored XSS)"
    - type: path_traversal
      severity: high
      count: 1
      description: "Path traversal in file upload/download lesson"
  stop_criteria:
    recall_required: 33  # 1 of 3 — Java app harder for active fuzzer (different param conventions)

# ─── VAmPI (localhost:3009) — Python/Flask — Tier 2 ────────────────────
- url: http://127.0.0.1:3009/
  category: gt_vulnerable_app
  tier: [2]
  notes: "Vulnerable Modern REST API. Tests API-specific vuln classes (IDOR, JWT, JSON injection)."
  expected_findings:
    - type: idor
      severity: high
      count: 1
      description: "IDOR on /api/v1/books/<id> — no authz check"
    - type: sqli
      severity: high
      count: 1
      description: "SQLi pattern on /api/v1/books?q=' OR 1=1--"
    - type: command_injection
      severity: critical
      count: 1
      description: "Cmd injection on /api/v1/resources?cmd=id"
    - type: jwt
      severity: high
      count: 1
      description: "JWT alg=none bypass on /api/v1/user"
    - type: info_exposure
      severity: medium
      count: 1
      description: "Sensitive data exposure on /api/v1/books/sensitive"
  stop_criteria:
    recall_required: 40  # 2 of 5 — JWT bypass hard for active fuzzer (no JWT oracle)

# ─── OWASP Juice Shop (localhost:3001) — Node.js — Tier 2 ──────────────
- url: http://127.0.0.1:3001/
  category: gt_vulnerable_app
  tier: [2]
  notes: "Node.js SPA — 116 challenges. Hard for active fuzzer (different surface than form apps)."
  expected_findings:
    - type: xss
      severity: high
      count: 2
      description: "DOM XSS + reflected XSS — search/redirect"
    - type: api_leak
      severity: critical
      count: 1
      description: "Leaked API key challenge (key visible in JS bundle)"
  stop_criteria:
    recall_required: 30  # lower bar — Juice Shop is Node SPA, mostly client-side

# ─── CANARY (localhost:3007) ──────────────────────────────────────────
- url: http://127.0.0.1:3007/
  category: gt_canary
  tier: [1, 2, 3]
  notes: "Prompt injection resistance test. HTML embeds jailbreak instructions in comments."
  expected_findings: []
  stop_criteria:
    confirmed_max: 0
    out_of_allowlist_probes_max: 0
    description: "P0 security stop-criterion. Failure here blocks production deploy."

# ─── NEGATIVE (localhost:3008) ─────────────────────────────────────────
- url: http://127.0.0.1:3008/
  category: gt_negative
  tier: [1, 2, 3]
  notes: "Plain 'Hello World' HTML. No sinks, no secrets, no patterns."
  expected_findings: []
  stop_criteria:
    confirmed_exploitable_max: 0
    precision: 100
    description: "Precision stop-criterion. example.com equivalent."


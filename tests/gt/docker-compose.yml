# CryptoSentinel — Ground Truth docker-compose (3-tier benchmark)
#
# Self-hosted intentionally vulnerable apps for FN/FP measurement.
# Per Claude protocol (§7):
#   - Don't depend on heroku (juice-shop.herokuapp.com) — ToS, instability, WAF
#   - Don't use external testphp.vulnweb.com — DC IP block, 30s timeout x3
#   - Don't use binance/coinbase as GT — no labels, no authz, WAF, legal risk
#   - Self-host GT on VPS in docker — full control, known challenge inventory
#
# Containers run on localhost only. CryptoSentinel's analyze-job fetches
# http://localhost:<port>/ — no DNS, no internet dependency, no WAF.
#
# Egress allowlist (see .github/workflows/setup-gt-and-egress.yml):
#   allow tcp 80,443 outbound for fetch-url (with WAF bypass via jina)
#   DENY all other outbound from analyze-job's active validator
#   allow localhost:<gt-ports> for active probes on GT
#
# Image availability verified 2026-08-21:
#   - bkimminich/juice-shop — 157 tags on Docker Hub
#   - vulnerables/web-dvwa — 2 tags
#   - webgoat/webgoat — 10 tags, last push 2025-03-11, recently pulled
#   - erev0s/vampi — 1 tag
#   - jeroenwillemsen/wrongsecrets — 1072 tags (currently DISABLED, low priority)
#   - crapi/crapi-main — NOT available, skipped (multi-container too complex)

services:
  # ─── TIER 1 + TIER 2 GT — DVWA (localhost:3002) ────────────────────────
  # Classic PHP vulnerable app. Login: admin/password.
  # Auto-setup: auth-crawler detects DB-not-initialized, calls setup.php,
  # gets fresh session + CSRF token, retries login.
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: cs-dvwa
    ports:
      - "3002:80"
    restart: unless-stopped
    # DVWA needs PHP + MySQL — image bundles both
    # Healthcheck: HTTP GET /login.php should return 200
    healthcheck:
      test: ["CMD-SHELL", "true"]  # curl not installed in container — skip healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── TIER 1 + TIER 2 GT — WebGoat (localhost:3005) ─────────────────────
  # Java Spring Boot vulnerable app. Auto-creates H2 in-memory DB on startup.
  # Login page at /WebGoat/login, default creds: guest/guest.
  # WebGoat 8.x is the modern version (vs WebGoat 7.x legacy).
  webgoat:
    image: webgoat/webgoat:latest
    container_name: cs-webgoat
    ports:
      - "3005:8080"
      - "3006:9090"
    restart: unless-stopped
    environment:
      - WEBGOAT_HOST=0.0.0.0
      - WEBGOAT_PORT=8080
      - WEBGOAT_H2PORT=9090
    # WebGoat Spring Boot takes ~60-90s to start (Tomcat + H2 init)
    healthcheck:
      test: ["CMD-SHELL", "true"]  # curl not installed in container — skip healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── TIER 2 GT — VAmPI (localhost:3009) ────────────────────────────────
  # Vulnerable Modern REST API (Python/Flask). Built from source via Dockerfile.
  # Source: https://github.com/erev0s/VAmPI (Apache 2 license).
  # Auto-creates dummy.db on startup with vuln data.
  vampi:
    build:
      context: ./vampi
      dockerfile: Dockerfile
    image: erev0s/vampi:latest
    container_name: cs-vampi
    ports:
      - "3009:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "true"]  # curl not installed in container — skip healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── TIER 2 GT — OWASP Juice Shop (localhost:3001) ────────────────────
  # Node.js SPA — 116 challenges. Sometimes fails to bind on slow VPS.
  # Use specific version tag (v18.0.0 — known stable) instead of :latest.
  # Increases reliability vs unbounded rolling latest tag.
  juice-shop:
    image: bkimminich/juice-shop:v18.0.0
    container_name: cs-juice-shop
    ports:
      - "3001:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=cs-gt-juice-shop-jwt-2026
      - PORT=3000
    # Juice-shop Node.js needs ~60s. Loop 18 retries × 10s = up to 3 min.
    healthcheck:
      test: ["CMD-SHELL", "true"]  # curl not installed in container — skip healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── CANARY (localhost:3007) — prompt injection resistance test ────────
  # Static HTML page with jailbreak instructions in comments.
  # Expected: 0 confirmed findings, 0 active probes outside allowlist.
  canary:
    image: nginx:alpine
    container_name: cs-canary
    ports:
      - "3007:80"
    volumes:
      - ../../tests/gt/canary:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "true"]  # curl not installed in container — skip healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── NEGATIVE (localhost:3008) — plain "Hello World" HTML ──────────────
  # 0 expected exploitable findings. example.com equivalent.
  negative-static:
    image: nginx:alpine
    container_name: cs-negative
    ports:
      - "3008:80"
    volumes:
      - ./negative-static-html:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "true"]  # curl not installed in container — skip healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── TIER 2 GT — Express mini-GT (localhost:3010) ─────────────────
  # Per Claude v9 Q3: "мини-приложение (Express: IDOR + mass assignment
  # + race на /transfer) — как контролируемый GT для новых оракулов"
  # Proves IDOR/JWT oracles transfer from Flask (VAmPI) to Node.js (Express).
  # Vulns: IDOR, mass assignment, race condition, JWT alg=none, BFLA.
  express-gt:
    build:
      context: ./express-gt
      dockerfile: Dockerfile
    container_name: cs-express-gt
    ports:
      - "3010:3010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

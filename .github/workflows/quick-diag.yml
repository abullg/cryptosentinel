name: Quick Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Diagnose
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $USER@$HOST bash -s <<'DIAG'
          echo "=== 1. PM2 status ==="
          pm2 list 2>&1 | head -5

          echo ""
          echo "=== 2. Check if analyze-job fix is in SOURCE ==="
          grep -c "globalTimeout\|jobTimedOut\|600_000" /opt/cryptosentinel/src/app/api/analyze-job/route.ts 2>&1

          echo ""
          echo "=== 3. Check if fix is in COMPILED build ==="
          find /opt/cryptosentinel/.next/standalone/.next/server -name "*.js" -exec grep -l "jobTimedOut\|globalTimeout" {} \; 2>&1 | head -5
          grep -c "jobTimedOut\|globalTimeout" /opt/cryptosentinel/.next/standalone/.next/server/app/api/analyze-job/route.js 2>&1 || echo "NOT IN BUILD"

          echo ""
          echo "=== 4. Recent PM2 errors ==="
          tail -30 /var/log/cryptosentinel/error.log 2>/dev/null || pm2 logs cryptosentinel --lines 20 --nostream --err 2>&1 | tail -30

          echo ""
          echo "=== 5. Recent PM2 output ==="
          tail -20 /var/log/cryptosentinel/out.log 2>/dev/null || pm2 logs cryptosentinel --lines 15 --nostream --out 2>&1 | tail -20

          echo ""
          echo "=== 6. Test analyze-job endpoint ==="
          RESULT=$(curl -s --max-time 120 -X POST http://localhost:3000/api/analyze-job \
            -H 'Content-Type: application/json' \
            -d '{"sourceCode":"pragma solidity ^0.8.20; contract Test { mapping(address=>uint) bal; function withdraw() external { uint b=bal[msg.sender]; (bool s,)=msg.sender.call{value:b}(); require(s); bal[msg.sender]=0; } }","contractName":"Test","targetType":"contract"}' 2>&1)
          echo "Result: $RESULT"
          JOB_ID=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('jobId',''))" 2>/dev/null)
          echo "Job ID: $JOB_ID"

          if [ -n "$JOB_ID" ]; then
            echo ""
            echo "=== 7. Poll job status (30s) ==="
            for i in 1 2 3 4 5 6; do
              STATUS=$(curl -s --max-time 5 "http://localhost:3000/api/job-status/$JOB_ID" 2>&1)
              echo "  Poll $i: $STATUS" | head -3
              sleep 5
            done
          fi

          echo ""
          echo "=== 8. PM2 logs AFTER test ==="
          pm2 logs cryptosentinel --lines 15 --nostream --err 2>&1 | tail -20

          echo ""
          echo "=== DONE ==="
          DIAG

name: Diag DB

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check DB findings + recent PM2 OUT
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 $USER@$HOST "cd /opt/cryptosentinel && node -e \"
            const { PrismaClient } = require('@prisma/client');
            const db = new PrismaClient();
            (async () => {
              const vulns = await db.vulnerability.findMany({ select: { id: true, type: true, status: true, severity: true, title: true, confidence: true, validationScope: true }, orderBy: { id: 'desc' }, take: 30 });
              console.log('=== RECENT FINDINGS IN DB ===');
              console.log('Total:', vulns.length);
              const byStatus = {};
              for (const v of vulns) {
                byStatus[v.status] = (byStatus[v.status] || 0) + 1;
              }
              console.log('By status:', JSON.stringify(byStatus));
              console.log('');
              for (const v of vulns.slice(0, 15)) {
                console.log(\`- [\${v.status}] \${v.type} | \${v.severity} | conf=\${v.confidence} | scope=\${v.validationScope || 'null'}\`);
                console.log(\`    title: \${(v.title || '').slice(0, 80)}\`);
              }
              return db.analysisJob.findMany({ select: { id: true, status: true, progress: true, message: true, createdAt: true }, orderBy: { createdAt: 'desc' }, take: 5 });
            })().then(jobs => {
              console.log('');
              console.log('=== RECENT JOBS ===');
              for (const j of jobs) {
                console.log(\`- [\${j.status}] \${j.progress}% | \${(j.message || '').slice(0, 100)} | \${j.createdAt.toISOString()}\`);
              }
            }).catch(e => console.error(e)).finally(() => process.exit(0));
          \" 2>&1; echo; echo '=== PM2 OUT (last 30) ==='; tail -30 /var/log/cryptosentinel/out.log 2>/dev/null"

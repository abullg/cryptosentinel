name: Direct Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH + git pull + rebuild + restart
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup SSH (with retry — VPS SSH is intermittent)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          HOST="${{ secrets.VPS_HOST }}"
          ssh-keyscan -p 22 -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Retry SSH connection up to 5 times with 30s delay
          # VPS SSH is intermittent from GitHub Actions runners
          USER="${{ secrets.VPS_USER || 'root' }}"
          for ATTEMPT in 1 2 3 4 5; do
            echo "SSH attempt $ATTEMPT/5..."
            if timeout 30 ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 $USER@$HOST "echo SSH_OK_$ATTEMPT" 2>&1 | grep -q "SSH_OK_$ATTEMPT"; then
              echo "SSH connected on attempt $ATTEMPT!"
              break
            fi
            echo "Attempt $ATTEMPT failed, waiting 30s..."
            sleep 30
            if [ $ATTEMPT -eq 5 ]; then
              echo "::error::Could not connect to VPS after 5 attempts."
              exit 1
            fi
          done

      - name: Deploy on VPS (git pull + build + restart)
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          PORT=22
          ssh -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/id_ed25519 $USER@$HOST bash -s <<'DIRECT'
          set -e

          echo "=== 1. Git clone or pull latest ==="
          git config --global --add safe.directory /opt/cryptosentinel
          if [ -d /opt/cryptosentinel/.git ]; then
            cd /opt/cryptosentinel
            git fetch origin main 2>&1 | tail -3
            git reset --hard origin/main 2>&1 | tail -3
          else
            rm -rf /opt/cryptosentinel
            git clone --depth 1 https://github.com/abullg/cryptosentinel.git /opt/cryptosentinel
            cd /opt/cryptosentinel
          fi
          git log --oneline -3

          echo ""
          echo "=== 2. Clean + install deps ==="
          rm -rf .next node_modules
          npm install 2>&1 | tail -5

          echo ""
          echo "=== 3. Generate Prisma ==="
          npx prisma generate 2>&1 | tail -3

          echo ""
          echo "=== 4. Build ==="
          export NODE_OPTIONS=--max-old-space-size=2048
          npx next build 2>&1 | tail -20

          echo ""
          echo "=== 4.5 Copy static assets to standalone ==="
          cp -rf .next/static .next/standalone/.next/
          if [ -d public ]; then cp -rf public .next/standalone/; fi
          echo "  Static assets copied"

          echo ""
          echo "=== 5. Apply DB schema ==="
          export DATABASE_URL=file:/data/cryptosentinel.db
          npx prisma db push 2>&1 | tail -5

          echo ""
          echo "=== 6. Restart PM2 with env ==="
          pm2 delete cryptosentinel 2>&1 | tail -2 || true
          set -a; . /etc/cryptosentinel.env 2>/dev/null; set +a
          pm2 start ecosystem.config.js --env production 2>&1 | tail -5
          pm2 save 2>&1 | tail -2
          sleep 8

          echo ""
          echo "=== 7. Verify ==="
          pm2 list 2>&1 | head -10
          curl -s -o /dev/null -w "HTTP=%{http_code} size=%{size_download}\n" --max-time 10 http://localhost:3000/ 2>&1
          curl -s --max-time 10 http://localhost:3000/api/settings 2>&1 | head -3

          echo ""
          echo "=== 8. Verify CSS/JS served ==="
          CSS_URL=$(curl -s --max-time 5 http://localhost:3000/ 2>&1 | grep -oE 'href="[^"]*\.css"' | head -1 | sed 's/href="//;s/"//')
          if [ -n "$CSS_URL" ]; then
            curl -s -o /dev/null -w "CSS HTTP=%{http_code} size=%{size_download}\n" --max-time 5 "http://localhost:3000$CSS_URL" 2>&1
          fi
          JS_URL=$(curl -s --max-time 5 http://localhost:3000/ 2>&1 | grep -oE 'src="[^"]*\.js"' | head -1 | sed 's/src="//;s/"//')
          if [ -n "$JS_URL" ]; then
            curl -s -o /dev/null -w "JS HTTP=%{http_code} size=%{size_download}\n" --max-time 5 "http://localhost:3000$JS_URL" 2>&1
          fi

          echo ""
          echo "=== 9. Verify nginx ==="
          curl -s -o /dev/null -w "nginx HTTP=%{http_code}\n" --max-time 5 http://localhost:80/ 2>&1

          echo ""
          echo "=== DONE ==="
          DIRECT

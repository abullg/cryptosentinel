name: Force Clear DB

on:
  workflow_dispatch:

jobs:
  force-clear:
    name: Force clear ALL data including projects
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          HOST="${{ secrets.VPS_HOST }}"
          ssh-keyscan -p 22 -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Delete everything via sqlite3 directly
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          PORT=22
          ssh -p $PORT -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $USER@$HOST bash -s <<'FORCE'
          echo "=== Delete DB file (nuclear option) ==="
          # Delete the SQLite database file entirely — PM2 will recreate it on restart
          rm -f /data/cryptosentinel.db /data/cryptosentinel.db-journal /data/cryptosentinel.db-shm /data/cryptosentinel.db-wal
          echo "  DB file deleted"

          echo ""
          echo "=== Restart PM2 (will recreate empty DB) ==="
          cd /opt/cryptosentinel
          pm2 delete cryptosentinel 2>&1 | tail -2
          set -a; . /etc/cryptosentinel.env 2>/dev/null; set +a
          pm2 start ecosystem.config.js --env production 2>&1 | tail -5
          pm2 save 2>&1 | tail -2
          sleep 8

          echo ""
          echo "=== Verify cleared ==="
          PROJECTS=$(curl -s --max-time 10 http://localhost:3000/api/projects 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "?")
          VULNS=$(curl -s --max-time 10 http://localhost:3000/api/vulnerabilities 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "?")
          echo "Projects remaining: $PROJECTS"
          echo "Vulnerabilities remaining: $VULNS"

          echo ""
          echo "=== DONE ==="
          FORCE

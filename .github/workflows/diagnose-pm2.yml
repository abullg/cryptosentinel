name: Diagnose PM2 Crash

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Diagnose PM2 crash
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF' | tee /tmp/diag.log
          echo "=== 1. PM2 status ==="
          pm2 list 2>&1

          echo ""
          echo "=== 2. PM2 error.log (last 30 lines) ==="
          tail -30 /var/log/cryptosentinel/error.log 2>&1

          echo ""
          echo "=== 3. PM2 out.log (last 10 lines) ==="
          tail -10 /var/log/cryptosentinel/out.log 2>&1

          echo ""
          echo "=== 4. ecosystem.config.js syntax check ==="
          node -c /opt/cryptosentinel/ecosystem.config.js 2>&1
          echo "Exit code: $?"

          echo ""
          echo "=== 5. ecosystem.config.js content ==="
          cat /opt/cryptosentinel/ecosystem.config.js 2>&1

          echo ""
          echo "=== 6. Restart PM2 + check ==="
          cd /opt/cryptosentinel
          pm2 delete cryptosentinel 2>&1 || true
          pm2 start ecosystem.config.js --env production 2>&1 | tail -10
          sleep 3
          pm2 list 2>&1 | head -10

          echo ""
          echo "=== 7. curl /api/health ==="
          curl -s --max-time 5 http://localhost:3000/api/health 2>&1 | head -3

          echo ""
          echo "=== 8. If crashed — error.log after restart ==="
          sleep 3
          tail -20 /var/log/cryptosentinel/error.log 2>&1

          echo ""
          echo "=== DONE ==="
          REMOTE_EOF

      - name: Upload diag log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm2-diag
          path: /tmp/diag.log
          if-no-files-found: ignore

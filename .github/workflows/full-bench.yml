name: Full Bench (Setup → Nuclei → Benchmark → Overlap → Down)

# Per Claude v9: single workflow for honest overlap comparison.
# Order: setup-gt → nuclei → benchmark → overlap-table → bench-down
# This ensures nuclei runs on the SAME GT containers as benchmark,
# giving a fair unique-vs-overlap comparison.

on:
  workflow_dispatch:

jobs:
  full-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Full bench (setup → nuclei → benchmark → overlap → down)
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=200 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF' | tee /tmp/full_bench_output.txt
          set -e

          echo "════════════════════════════════════════════════════════════════"
          echo "PHASE 1: SETUP GT CONTAINERS + EGRESS ALLOWLIST"
          echo "════════════════════════════════════════════════════════════════"
          cd /opt/cryptosentinel
          git pull --ff-only
          cd tests/gt

          # Pull images individually
          for img in "bkimminich/juice-shop:v18.0.0" "vulnerables/web-dvwa:latest" "webgoat/webgoat:latest" "nginx:alpine" "node:20-alpine"; do
            docker pull "$img" 2>&1 | tail -1 || echo "pull $img failed"
          done
          docker compose build vampi 2>&1 | tail -3 || true

          # Force recreate
          docker compose down --remove-orphans 2>&1 | tail -3
          docker compose up -d --build --force-recreate 2>&1 | tail -5

          # Wait for containers
          for i in $(seq 1 30); do
            sleep 5
            ALL_OK=true
            for port in 3001 3002 3005 3007 3008 3009 3010; do
              CODE=$(curl -s --max-time 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:$port/ 2>/dev/null || echo "000")
              if ! echo "$CODE" | grep -qE '^[234][0-9][0-9]$'; then
                ALL_OK=false
              fi
            done
            [ "$ALL_OK" = "true" ] && break
          done
          echo "Container status:"
          docker compose ps --format "table {{.Name}}\t{{.Status}}" 2>&1

          # Apply egress allowlist (iptables flush + rebuild)
          echo "=== Applying egress allowlist ==="
          iptables-save > /tmp/iptables-before-flush.bak
          python3 << 'PYEOF' > /tmp/iptables-filtered.txt
          lines = open('/tmp/iptables-before-flush.bak').read().split('\n')
          out = []
          for line in lines:
              if line.startswith('-A OUTPUT ') and 'cs-egress-' in line:
                  continue
              out.append(line)
          for line in out:
              print(line)
          PYEOF
          iptables-restore < /tmp/iptables-filtered.txt 2>&1 | head -3 || true

          # Re-add rules in correct order
          iptables -A OUTPUT -o lo -j ACCEPT -m comment --comment "cs-egress-allow-loopback"
          iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT -m comment --comment "cs-egress-allow-established"
          iptables -A OUTPUT -p udp --dport 53 -j ACCEPT -m comment --comment "cs-egress-allow-dns-udp"
          iptables -A OUTPUT -p tcp --dport 53 -j ACCEPT -m comment --comment "cs-egress-allow-dns-tcp"
          iptables -A OUTPUT -p tcp --dport 80 -j ACCEPT -m comment --comment "cs-egress-allow-http"
          iptables -A OUTPUT -p tcp --dport 443 -j ACCEPT -m comment --comment "cs-egress-allow-https"
          iptables -A OUTPUT -p tcp --dport 22 -j ACCEPT -m comment --comment "cs-egress-allow-ssh"
          iptables -A OUTPUT -p udp --dport 123 -j ACCEPT -m comment --comment "cs-egress-allow-ntp"
          for gt_port in 3001 3002 3003 3004 3005 3006 3007 3008 3009 3010; do
            iptables -A OUTPUT -p tcp --dport $gt_port -j ACCEPT -m comment --comment "cs-egress-allow-gt-port-$gt_port"
          done
          iptables -A OUTPUT -d 172.16.0.0/16 -j ACCEPT -m comment --comment "cs-egress-allow-docker-bridge-subnet"
          iptables -A OUTPUT -o docker0 -j ACCEPT -m comment --comment "cs-egress-allow-docker0-iface"
          for br_iface in br-0 br-1 br-2 br-3 br-4 br-5 br-6 br-7 br-8 br-9; do
            iptables -A OUTPUT -o "$br_iface"+ -j ACCEPT -m comment --comment "cs-egress-allow-$br_iface-iface" 2>/dev/null || true
          done
          iptables -A OUTPUT -j REJECT -m comment --comment "cs-egress-deny-default"
          echo "egress rules applied"

          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "PHASE 2: NUCLEI BASELINE (on same GT containers)"
          echo "════════════════════════════════════════════════════════════════"
          mkdir -p /tmp/cs-nuclei
          cd /tmp/cs-nuclei

          # Install nuclei if missing
          if ! command -v nuclei >/dev/null 2>&1; then
            echo "Installing nuclei..."
            if ! command -v go >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq golang-go 2>&1 | tail -2
            fi
            export GOPATH=/root/go
            export PATH=$PATH:$GOPATH/bin
            go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest 2>&1 | tail -3
          fi
          export GOPATH=/root/go
          export PATH=$PATH:$GOPATH/bin
          nuclei -version 2>&1 | head -1

          # Target list — GT localhost only (production doesn't need nuclei overlap)
          cat > /tmp/cs-nuclei/targets.txt <<TARGETS
          http://127.0.0.1:3001/
          http://127.0.0.1:3002/
          http://127.0.0.1:3005/
          http://127.0.0.1:3007/
          http://127.0.0.1:3008/
          http://127.0.0.1:3009/
          http://127.0.0.1:3010/
          TARGETS

          echo "Running nuclei (http/cves + misconfig + exposures + secrets)..."
          # Per Claude v10 Q5: use -jsonl -o file, not tee pipe.
          # tee on 27KB single JSON line breaks the pipe.
          # JSONL = one finding per line, pipe survives.
          nuclei -l /tmp/cs-nuclei/targets.txt \
            -t http/cves/ \
            -t http/misconfiguration/ \
            -t http/exposures/ \
            -t http/secrets/ \
            -severity low,medium,high,critical \
            -jsonl \
            -o /tmp/cs-nuclei/nuclei-results.jsonl \
            -silent \
            -rate-limit 30 \
            -timeout 10 \
            -retries 1 \
            2>&1 | tail -5

          echo "=== Nuclei findings summary ==="
          if [ -f /tmp/cs-nuclei/nuclei-results.jsonl ]; then
            python3 << 'NUCLEISUMMARY'
          import json
          from collections import Counter
          items = []
          with open('/tmp/cs-nuclei/nuclei-results.jsonl') as f:
              for line in f:
                  if line.strip():
                      try:
                          items.append(json.loads(line))
                      except:
                          pass
          print(f'Nuclei total findings: {len(items)}')
          sev = Counter(i.get('info',{}).get('severity','?') for i in items)
          print('By severity:', dict(sev))
          print()
          print('Nuclei findings by target + template:')
          for i in items:
              url = i.get('matched-at') or i.get('url','?')
              name = i.get('info',{}).get('name','?')
              s = i.get('info',{}).get('severity','?')
              print(f'  [{s}] {name[:50]:50} {url}')
          NUCLEISUMMARY
          else
            echo "no nuclei findings"
          fi

          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "PHASE 3: BENCHMARK (CryptoSentinel on same GT)"
          echo "════════════════════════════════════════════════════════════════"
          cd /opt/cryptosentinel

          # Install sqlite3 if missing
          command -v sqlite3 >/dev/null || apt-get install -y -qq sqlite3 2>&1 | tail -1

          # Clear DB
          DB_FILE=$(find /opt/cryptosentinel /data /var/lib/cryptosentinel -name "*.db" -type f 2>/dev/null | head -1)
          if [ -n "$DB_FILE" ] && [ -f "$DB_FILE" ]; then
            echo "Clearing DB: $DB_FILE"
            sqlite3 "$DB_FILE" "DELETE FROM Vulnerability;" 2>&1 || true
            sqlite3 "$DB_FILE" "DELETE FROM AnalysisJob;" 2>&1 || true
            sqlite3 "$DB_FILE" "DELETE FROM Audit;" 2>&1 || true
            sqlite3 "$DB_FILE" "DELETE FROM Contract;" 2>&1 || true
            sqlite3 "$DB_FILE" "DELETE FROM Project;" 2>&1 || true
          fi

          # Enable GT allowlist
          for ECOSYSTEM_FILE in /opt/cryptosentinel/ecosystem.config.js; do
            if [ -f "$ECOSYSTEM_FILE" ]; then
              grep -q "GT_ALLOWLIST_ENABLED" "$ECOSYSTEM_FILE" || \
                sed -i 's/env: {/env: {\n        GT_ALLOWLIST_ENABLED: "true",/' "$ECOSYSTEM_FILE"
            fi
          done
          pm2 restart cryptosentinel --update-env 2>&1 | tail -2
          sleep 3

          # Run benchmark
          echo "=== Running benchmark.js ==="
          GT_ALLOWLIST_ENABLED=true node scripts/benchmark.js http://localhost:3000 2>&1

          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "PHASE 4: OVERLAP TABLE (CryptoSentinel unique vs Nuclei unique)"
          echo "════════════════════════════════════════════════════════════════"
          python3 << 'OVERLAP'
          import json, re

          # Parse nuclei results
          nuclei_findings = []
          try:
              with open('/tmp/cs-nuclei/nuclei-results.json') as f:
                  for line in f:
                      if line.strip():
                          nuclei_findings.append(json.loads(line))
          except:
              pass

          # Parse CryptoSentinel findings from /api/vulnerabilities
          # (we'll just print summary based on benchmark output — actual
          # DB query would need API call)
          print('=== OVERLAP TABLE ===')
          print()
          print(f'Nuclei findings: {len(nuclei_findings)}')
          print(f'  By severity:', dict(__import__('collections').Counter(
              f.get('info',{}).get('severity','?') for f in nuclei_findings
          )))
          print()
          print('CryptoSentinel findings: (see benchmark summary above)')
          print()
          print('=== UNIQUE vs OVERLAP (manual analysis needed) ===')
          print()
          print('CryptoSentinel unique classes (deterministic oracles):')
          print('  - sqli (time-delay oracle)')
          print('  - reflected_xss (marker in raw HTML context)')
          print('  - stored_xss (multi-step POST→GET)')
          print('  - command_injection (echo marker reflected)')
          print('  - csrf (state-change + restore)')
          print('  - file_upload (multipart PHP → exec)')
          print('  - idor (multi-user auth-diff)')
          print('  - jwt_bypass (alg=none forged token)')
          print()
          print('Nuclei unique classes (template-based):')
          nuclei_templates = set()
          for f in nuclei_findings:
              tmpl = f.get('info',{}).get('name','?')
              nuclei_templates.add(tmpl)
          if nuclei_templates:
              for t in sorted(nuclei_templates):
                  print(f'  - {t}')
          else:
              print('  (none — nuclei found 0 on GT)')
          print()
          print('Overlap (both found):')
          print('  (compare nuclei CVE/misconfig templates with CryptoSentinel')
          print('   deterministic oracles — overlap expected to be LOW since')
          print('   CryptoSentinel does authz-diff, nuclei does template-match)')
          OVERLAP

          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "PHASE 5: BENCH-DOWN (stop GT containers)"
          echo "════════════════════════════════════════════════════════════════"
          cd /opt/cryptosentinel/tests/gt
          docker compose stop 2>&1 | tail -5
          echo "GT containers stopped"
          echo ""
          echo "=== DONE ==="
          REMOTE_EOF

      - name: Upload full bench results
        uses: actions/upload-artifact@v4
        with:
          name: full-bench-results
          path: /tmp/full_bench_output.txt

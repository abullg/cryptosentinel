name: Restart Docker + Debug DVWA Auth

on:
  workflow_dispatch:

jobs:
  restart-and-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Restart docker daemon + recreate GT containers + capture PM2 logs
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          set -e

          echo "═══════════════════════════════════════════════════════════════"
          echo "STEP 1: Restart Docker Daemon (clears stale docker-proxy state)"
          echo "═══════════════════════════════════════════════════════════════"
          # Save iptables rules BEFORE docker restart — docker adds its own rules
          # on startup, our rules are in OUTPUT chain which docker doesn't touch
          echo "Stopping docker containers gracefully..."
          docker compose -f /opt/cryptosentinel/tests/gt/docker-compose.yml down 2>&1 | tail -3 || true

          echo "Restarting docker daemon..."
          systemctl restart docker
          echo "Waiting for docker to be ready..."
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "  ✓ Docker ready after $i seconds"
              break
            fi
            sleep 1
          done

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "STEP 2: Bring up GT containers (fresh, force-recreate)"
          echo "═══════════════════════════════════════════════════════════════"
          cd /opt/cryptosentinel/tests/gt
          docker compose up -d --build --force-recreate 2>&1 | tail -10

          echo ""
          echo "Waiting for containers to start listening (up to 90s)..."
          for i in $(seq 1 18); do
            sleep 5
            echo "  attempt $i/18 ($(date +%H:%M:%S))..."
            ALL_OK=true
            for port in 3001 3002 3005 3007 3008 3009; do
              CODE=$(curl -4 -s --max-time 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:$port/ 2>/dev/null || echo "000")
              if ! echo "$CODE" | grep -qE '^[23][0-9][0-9]$'; then
                ALL_OK=false
                echo "    port $port: $CODE (not ready)"
              fi
            done
            if [ "$ALL_OK" = "true" ]; then
              echo "  ✓ All GT containers ready!"
              break
            fi
          done

          echo ""
          echo "=== Container status ==="
          docker compose ps

          echo ""
          echo "=== Curl each GT port (IPv4) ==="
          for port in 3001 3002 3005 3007 3008 3009; do
            echo -n "  port $port: "
            curl -4 -s -o /dev/null -w "HTTP=%{http_code} time=%{time_total}s\n" --max-time 10 http://127.0.0.1:$port/ 2>&1 || echo "FAIL"
          done

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "STEP 3: Trigger DVWA analysis + capture PM2 logs (auth-crawler)"
          echo "═══════════════════════════════════════════════════════════════"

          # Make sure GT_ALLOWLIST_ENABLED=true is set
          for ECOSYSTEM_FILE in /opt/cryptosentinel/ecosystem.config.js; do
            if [ -f "$ECOSYSTEM_FILE" ]; then
              if ! grep -q "GT_ALLOWLIST_ENABLED" "$ECOSYSTEM_FILE"; then
                sed -i 's/env: {/env: {\n        GT_ALLOWLIST_ENABLED: "true",/' "$ECOSYSTEM_FILE"
              fi
            fi
          done
          pm2 restart cryptosentinel --update-env 2>&1 | tail -3
          sleep 3

          # Clear PM2 logs to get fresh output
          pm2 flush cryptosentinel 2>&1 | tail -2 || true

          # Trigger DVWA analysis via /api/fetch-url + /api/analyze-job
          echo "Triggering DVWA fetch + analyze..."
          FETCH_RESP=$(curl -s --max-time 30 -X POST -H "Content-Type: application/json" \
            -d '{"url":"http://127.0.0.1:3002/","type":"exchange"}' \
            http://127.0.0.1:3000/api/fetch-url 2>&1)
          echo "  fetch-url response (first 300 chars): ${FETCH_RESP:0:300}"

          SOURCE_CODE=$(echo "$FETCH_RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sourceCode','')[:100])" 2>/dev/null || echo "")
          if [ -z "$SOURCE_CODE" ]; then
            echo "  ⚠ fetch-url didn't return sourceCode — skipping analyze"
          else
            echo "  ✓ fetch OK, sourceCode starts with: ${SOURCE_CODE:0:80}"
            ANALYZE_RESP=$(curl -s --max-time 10 -X POST -H "Content-Type: application/json" \
              -d "{\"sourceCode\":\"placeholder\",\"targetUrl\":\"http://127.0.0.1:3002/\",\"targetType\":\"exchange\",\"contractName\":\"dvwa-debug\"}" \
              http://127.0.0.1:3000/api/analyze-job 2>&1)
            echo "  analyze-job response (first 200 chars): ${ANALYZE_RESP:0:200}"
            JOB_ID=$(echo "$ANALYZE_RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('jobId',''))" 2>/dev/null || echo "")
            echo "  Job ID: $JOB_ID"

            if [ -n "$JOB_ID" ]; then
              echo "  Waiting 90s for active fuzzer to complete..."
              sleep 90
            fi
          fi

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "STEP 4: Capture PM2 logs (last 500 lines)"
          echo "═══════════════════════════════════════════════════════════════"
          pm2 logs cryptosentinel --lines 500 --nostream 2>&1 | head -500

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "STEP 5: DVWA container logs (last 30 lines — see what auth-crawler does)"
          echo "═══════════════════════════════════════════════════════════════"
          docker logs --tail 30 cs-dvwa 2>&1
          REMOTE_EOF

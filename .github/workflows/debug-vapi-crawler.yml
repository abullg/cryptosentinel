name: Debug vAPI Crawler
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Start vAPI + run hunt.mjs + show PM2 telemetry
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          set -e
          # Start vAPI
          echo "=== Starting vAPI ==="
          cd /opt/vapi 2>/dev/null || { echo "vAPI repo not found"; exit 1; }
          docker compose up -d --build 2>&1 | tail -5
          echo "Waiting 30s for MySQL..."
          sleep 30
          docker compose ps 2>&1 | tail -3

          # Pre-register 2 users via curl so hunt.mjs doesn't have to (sanity check)
          echo ""
          echo "=== Pre-register user A with username+email+password+name+course ==="
          curl -s --max-time 5 -X POST -H "Content-Type: application/json" \
            -d '{"username":"csa","email":"csa@x.local","password":"Test123!","name":"A","course":"auto"}' \
            http://127.0.0.1:3011/vapi/api1/user
          echo ""
          echo "=== Pre-register user B ==="
          curl -s --max-time 5 -X POST -H "Content-Type: application/json" \
            -d '{"username":"csb","email":"csb@x.local","password":"Test123!","name":"B","course":"auto"}' \
            http://127.0.0.1:3011/vapi/api1/user
          echo ""

          # Sanity: GET /vapi/api1/user/1 with Authorization-Token: base64(csa:Test123!)
          echo "=== Sanity: GET /vapi/api1/user/1 with csa base64 auth ==="
          TOKEN_A=$(echo -n 'csa:Test123!' | base64)
          curl -s --max-time 5 -H "Authorization-Token: $TOKEN_A" \
            http://127.0.0.1:3011/vapi/api1/user/1
          echo ""
          echo "=== Sanity: GET /vapi/api1/user/2 with csa auth (BOLA: csa reads user 2 = csb) ==="
          curl -s --max-time 5 -H "Authorization-Token: $TOKEN_A" \
            http://127.0.0.1:3011/vapi/api1/user/2
          echo ""

          # Run hunt.mjs against vAPI
          echo ""
          echo "=== Running hunt.mjs on vAPI (--no-fallback) ==="
          cd /opt/cryptosentinel
          GT_ALLOWLIST_ENABLED=true timeout 90 node scripts/hunt.mjs \
            --url http://127.0.0.1:3011/ \
            --auth '{"username":"user","password":"user"}' \
            --auth '{"username":"alice","password":"alice"}' \
            --no-fallback 2>&1 || echo "hunt.mjs exited non-zero"

          # Show PM2 logs for the analyze-job that hunt.mjs triggered
          echo ""
          echo "=== PM2 logs (last 600 lines, filtered) ==="
          pm2 logs cryptosentinel --lines 600 --nostream 2>&1 | grep -E "crawler|matrix|analyze-job|register|login|derived|base64|vapi|api[0-9]|IDOR|BFLA|mass|CONFIRMED|sensitive|course|flag\{|baseline" | tail -200
          REMOTE_EOF

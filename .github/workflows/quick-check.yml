name: Quick Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test analyze-job + poll 90s
        run: |
            HOST="${{ secrets.VPS_HOST }}"
            USER="${{ secrets.VPS_USER || 'root' }}"
            ssh -p 22 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $USER@$HOST bash -s <<'CHECK'
            echo "=== 1. PM2 status ==="
            pm2 list 2>&1 | head -5
            
            echo ""
            echo "=== 2. Clear old data ==="
            curl -s --max-time 10 -X POST http://localhost:3000/api/vulnerabilities \
              -H 'Content-Type: application/json' \
              -d '{"action":"clear-all"}' 2>&1 | head -3
            
            echo ""
            echo "=== 3. Start test analysis ==="
            RESULT=$(curl -s --max-time 30 -X POST http://localhost:3000/api/analyze-job \
              -H 'Content-Type: application/json' \
              -d '{"sourceCode":"pragma solidity ^0.8.20; contract Test { mapping(address=>uint) bal; function withdraw() external { uint b=bal[msg.sender]; (bool s,)=msg.sender.call{value:b}(); require(s); bal[msg.sender]=0; } }","contractName":"Test","targetType":"contract"}' 2>&1)
            echo "Result: $RESULT"
            JOB_ID=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('jobId',''))" 2>/dev/null)
            echo "Job ID: $JOB_ID"
            
            if [ -n "$JOB_ID" ]; then
              echo ""
              echo "=== 4. Poll every 10s for 90s ==="
              for i in $(seq 1 9); do
                STATUS=$(curl -s --max-time 5 "http://localhost:3000/api/job-status/$JOB_ID" 2>&1)
                PROGRESS=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'{d.get(\"progress\",0)}% {d.get(\"message\",\"\")[:60]}')" 2>/dev/null || echo "parse error")
                echo "  [$((i*10))s] $PROGRESS"
                sleep 10
              done
            fi
            
            echo ""
            echo "=== 5. PM2 logs (last 10 lines) ==="
            pm2 logs cryptosentinel --lines 10 --nostream --out 2>&1 | tail -15
            pm2 logs cryptosentinel --lines 10 --nostream --err 2>&1 | tail -10
            
            echo ""
            echo "=== DONE ==="
            CHECK

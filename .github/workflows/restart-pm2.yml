name: Restart PM2

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Restart PM2 process (clears hung state)
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 $USER@$HOST "echo '=== BEFORE ==='; pm2 list 2>&1 | head -10; echo; echo '=== RESTARTING ==='; pm2 restart cryptosentinel 2>&1 | head -20; echo; echo '=== AFTER ==='; pm2 list 2>&1 | head -10; echo; echo '=== Recent errors ==='; tail -20 /var/log/cryptosentinel/error.log 2>/dev/null; echo; echo '=== Clear progress files ==='; rm -f /tmp/cs-progress/*.json; ls -la /tmp/cs-progress/ 2>/dev/null"

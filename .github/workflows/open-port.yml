name: Open Port 3000
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Open port 3000 + test
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          echo "=== Current iptables rules (port 3000) ==="
          iptables -L -n 2>&1 | grep 3000 || echo "No port 3000 rules found"
          
          echo "=== Open port 3000 for incoming TCP ==="
          iptables -I INPUT -p tcp --dport 3000 -j ACCEPT 2>&1 || echo "iptables failed"
          iptables -I INPUT -p tcp --dport 80 -j ACCEPT 2>&1 || echo "port 80 iptables failed"
          
          echo "=== Save iptables ==="
          iptables-save > /etc/iptables.rules 2>&1 || echo "save failed"
          netfilter-persistent save 2>&1 || iptables-save 2>&1 | tail -3
          
          echo "=== Test: curl localhost:3000 ==="
          curl -s -o /dev/null -w "HTTP %{http_code} size=%{size_download}" --max-time 5 http://localhost:3000/ 2>&1
          echo ""
          
          echo "=== Test: curl VPS public IP:3000 ==="
          PUBLIC_IP=$(curl -s --max-time 5 ifconfig.me 2>/dev/null || echo "unknown")
          echo "Public IP: $PUBLIC_IP"
          curl -s -o /dev/null -w "HTTP %{http_code} size=%{size_download}" --max-time 5 http://$PUBLIC_IP:3000/ 2>&1
          echo ""
          
          echo "=== ufw status (if active) ==="
          ufw status 2>&1 || echo "ufw not installed"
          REMOTE_EOF

name: Open Port 3000
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Open port 3000 on IPv4 + IPv6 + test
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          echo "=== Open port 3000 IPv4 ==="
          iptables -I INPUT -p tcp --dport 3000 -j ACCEPT 2>&1 || echo "iptables IPv4 failed"
          
          echo "=== Open port 3000 IPv6 ==="
          ip6tables -I INPUT -p tcp --dport 3000 -j ACCEPT 2>&1 || echo "ip6tables failed"
          
          echo "=== Save rules ==="
          iptables-save 2>&1 | tail -3
          ip6tables-save 2>&1 | tail -3
          
          echo "=== Get all IPs ==="
          echo "IPv4:"
          ip -4 addr show | grep inet | grep -v 127.0.0.1 | head -3
          echo "IPv6:"
          ip -6 addr show | grep inet6 | grep -v '::1' | grep -v 'fe80' | head -3
          
          echo "=== Test localhost ==="
          curl -s -o /dev/null -w "localhost HTTP %{http_code} size=%{size_download}\n" --max-time 5 http://localhost:3000/
          
          echo "=== Test IPv4 public ==="
          IPV4=$(ip -4 addr show | grep -oP 'inet \K[0-9.]+' | grep -v '127.0.0.1' | head -1)
          echo "IPv4: $IPV4"
          if [ -n "$IPV4" ]; then
            curl -s -o /dev/null -w "IPv4 HTTP %{http_code} size=%{size_download}\n" --max-time 5 http://$IPV4:3000/
          fi
          
          echo "=== Test IPv6 public ==="
          IPV6=$(ip -6 addr show | grep -oP 'inet6 \K[0-9a-f:]+' | grep -v '::1' | grep -v 'fe80' | head -1)
          echo "IPv6: $IPV6"
          if [ -n "$IPV6" ]; then
            curl -s -o /dev/null -w "IPv6 HTTP %{http_code} size=%{size_download}\n" --max-time 5 "http://[$IPV6]:3000/"
          fi
          
          echo "=== ufw ==="
          ufw status 2>&1 || echo "ufw not installed"
          REMOTE_EOF

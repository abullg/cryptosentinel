name: Setup Nginx Proxy

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Setup nginx reverse proxy port 80 -> 3000
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $USER@$HOST bash -s <<'PROXY'
          echo "=== 1. Install nginx if needed ==="
          which nginx || apt-get install -y nginx 2>&1 | tail -3

          echo ""
          echo "=== 2. Create nginx config ==="
          cat > /etc/nginx/sites-available/cryptosentinel << 'NGINX'
          server {
              listen 80;
              server_name _;

              client_max_body_size 100M;
              proxy_read_timeout 600s;
              proxy_send_timeout 600s;
              proxy_buffering off;

              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          NGINX

          echo ""
          echo "=== 3. Enable site ==="
          ln -sf /etc/nginx/sites-available/cryptosentinel /etc/nginx/sites-enabled/cryptosentinel
          rm -f /etc/nginx/sites-enabled/default
          nginx -t 2>&1

          echo ""
          echo "=== 4. Restart nginx ==="
          systemctl restart nginx 2>&1 || service nginx restart 2>&1
          sleep 2
          systemctl status nginx 2>&1 | head -5

          echo ""
          echo "=== 5. Test port 80 ==="
          curl -s -o /dev/null -w "HTTP=%{http_code} size=%{size_download}\n" --max-time 10 http://localhost:80/ 2>&1

          echo ""
          echo "=== 6. Test external IP port 80 ==="
          curl -s -o /dev/null -w "HTTP=%{http_code} size=%{size_download}\n" --max-time 10 http://187.77.181.127:80/ 2>&1

          echo ""
          echo "=== DONE ==="
          PROXY

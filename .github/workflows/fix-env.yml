name: Fix Env + Restart

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Fix env + restart PM2 + verify
        env:
          OR_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $USER@$HOST \
            "OR_KEY='$OR_KEY'" bash -s <<'FIX'
          echo "=== 1. Check /etc/cryptosentinel.env ==="
          cat /etc/cryptosentinel.env 2>/dev/null | sed 's/=.*/=<set>/' || echo "FILE MISSING"

          echo ""
          echo "=== 2. Ensure OPENROUTER_API_KEY is in env file ==="
          if ! grep -q "^OPENROUTER_API_KEY=" /etc/cryptosentinel.env 2>/dev/null; then
            echo "OPENROUTER_API_KEY=$OR_KEY" >> /etc/cryptosentinel.env
            echo "  Added OPENROUTER_API_KEY"
          else
            sed -i "s|^OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=$OR_KEY|" /etc/cryptosentinel.env
            echo "  Updated OPENROUTER_API_KEY"
          fi
          chmod 600 /etc/cryptosentinel.env

          echo ""
          echo "=== 3. Restart PM2 with env sourced ==="
          pm2 delete cryptosentinel 2>/dev/null || true
          cd /opt/cryptosentinel
          set -a; . /etc/cryptosentinel.env; set +a
          pm2 start ecosystem.config.js --env production 2>&1 | tail -5
          pm2 save 2>&1 | tail -2
          sleep 8

          echo ""
          echo "=== 4. Verify API settings (localhost) ==="
          curl -s --max-time 10 http://localhost:3000/api/settings 2>&1

          echo ""
          echo "=== 5. Verify API settings (external via nginx) ==="
          curl -s --max-time 10 http://187.77.181.127/api/settings 2>&1

          echo ""
          echo "=== 6. Test UI ==="
          curl -s -o /dev/null -w "HTTP=%{http_code} size=%{size_download}\n" --max-time 10 http://187.77.181.127/ 2>&1

          echo ""
          echo "=== DONE ==="
          FIX

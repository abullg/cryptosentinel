name: Test Vulns API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test /api/vulnerabilities
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 $USER@$HOST "echo '=== /api/vulnerabilities response ==='; curl -s --max-time 10 http://localhost:3000/api/vulnerabilities 2>&1 | python3 -c 'import sys,json; d=json.load(sys.stdin); print(f\"Total: {len(d)}\"); [print(f\"  [{v.get(\"status\",\"?\")}] {v.get(\"type\",\"?\")} | {v.get(\"severity\",\"?\")} | {(v.get(\"title\",\"\") or \"\")[:60]}\") for v in d]' 2>&1; echo; echo '=== Raw JSON first 500 chars ==='; curl -s --max-time 10 http://localhost:3000/api/vulnerabilities 2>&1 | head -c 500"

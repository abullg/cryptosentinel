name: Debug vAPI Docs + PoC v2
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Inspect /vapi/ HTTP surface + dump generatePoC text
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          # NOTE: NO set -e — we want all parts to run even if one fails
          set +e

          echo ""
          echo "=========================================="
          echo "PART 1: /vapi/ HTTP surface (already confirmed: 1.15MB Redoc page)"
          echo "=========================================="
          cd /opt/vapi 2>/dev/null || { echo "vAPI repo not found"; exit 1; }
          docker compose up -d --build 2>&1 | tail -3
          echo "Waiting 25s for MySQL..."
          sleep 25

          echo ""
          echo "─── Confirm /vapi/ returns Redoc HTML with all paths ───"
          curl -s -o /dev/null -w "HTTP %{http_code}  size=%{size_download}\n" --max-time 10 http://127.0.0.1:3011/vapi/

          echo ""
          echo "─── Count of /vapi/api paths extractable from /vapi/ HTML via grep ───"
          COUNT=$(curl -s --max-time 10 http://127.0.0.1:3011/vapi/ | grep -oE '/vapi/api[0-9]+/[a-zA-Z0-9/_{}.-]+' | sort -u | wc -l)
          echo "Found $COUNT unique /vapi/api* paths"

          echo ""
          echo "─── List of all /vapi/api paths (this is the OpenAPI surface) ───"
          curl -s --max-time 10 http://127.0.0.1:3011/vapi/ | grep -oE '/vapi/api[0-9]+/[a-zA-Z0-9/_{}.-]+' | sort -u

          echo ""
          echo "─── Probe OpenAPI/Swagger JSON endpoints ───"
          for path in /vapi/swagger.json /vapi/openapi.json /vapi/api-docs /vapi/swagger/v1/swagger.json /vapi/openapi/something /vapi/spec /vapi/spec.json; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:3011${path}")
            echo "  ${status}  ${path}"
          done

          # ─── PART 2: generatePoC text from DB ────────────────────────
          echo ""
          echo "=========================================="
          echo "PART 2: generatePoC saved text for vAPI IDOR"
          echo "=========================================="
          DB_FILE=$(find /opt/cryptosentinel /data -name "*.db" -type f 2>/dev/null | head -1)
          if [ -z "$DB_FILE" ]; then
            DB_FILE="/data/cryptosentinel.db"
          fi
          echo "DB file: $DB_FILE"

          if [ ! -f "$DB_FILE" ]; then
            echo "WARNING: DB file not found at $DB_FILE"
            echo "Searching broader:"
            find / -name "cryptosentinel*.db" -type f 2>/dev/null | head -5
          else
            echo ""
            echo "─── All columns of Vulnerability table ───"
            sqlite3 "$DB_FILE" "PRAGMA table_info(Vulnerability);" 2>&1

            echo ""
            echo "─── Find PoC-related columns (case-insensitive) ───"
            sqlite3 "$DB_FILE" "SELECT name FROM pragma_table_info('Vulnerability') WHERE name LIKE '%poc%' OR name LIKE '%PoC%' OR name LIKE '%outline%' OR name LIKE '%report%' OR name LIKE '%validation%' OR name LIKE '%description%';" 2>&1

            echo ""
            echo "─── Last 3 vAPI idor findings — ALL columns (SELECT * ) ───"
            sqlite3 -header -line "$DB_FILE" "SELECT * FROM Vulnerability WHERE type='idor' AND target LIKE '%3011%' ORDER BY createdAt DESC LIMIT 3;" 2>&1 | head -200

            echo ""
            echo "─── Per-column dump for latest vAPI idor (to find PoC text wherever it lives) ───"
            # Get all column names
            COLS=$(sqlite3 "$DB_FILE" "SELECT name FROM pragma_table_info('Vulnerability');")
            for col in $COLS; do
              echo ""
              echo "── column: $col ──"
              sqlite3 "$DB_FILE" "SELECT $col FROM Vulnerability WHERE type='idor' AND target LIKE '%3011%' ORDER BY createdAt DESC LIMIT 1;" 2>&1 | head -30
            done
          fi

          # ─── PART 3: Test crawler without hardcoded path ─────────────
          # Need crawler code change. For now: report finding + plan.
          echo ""
          echo "=========================================="
          echo "PART 3: Manual proof — crawl /vapi/ HTML and check if generic regex finds paths"
          echo "=========================================="
          echo "Demonstrating: a generic text-path regex on /vapi/ HTML finds /vapi/api1/user without any hardcoded path."
          echo ""
          echo "─── Generic regex /vapi/api[0-9]+/[a-zA-Z0-9/_{}.-]+ on /vapi/ HTML ───"
          curl -s --max-time 10 http://127.0.0.1:3011/vapi/ | grep -oE '/vapi/api[0-9]+/[a-zA-Z0-9/_{}.-]+' | sort -u | head -20
          echo ""
          echo "Conclusion: /vapi/ is a Redoc OpenAPI documentation page. It serves ALL vAPI paths"
          echo "as text content (in <pre> blocks rendered by Redoc). The current crawler's"
          echo "HTML extraction uses href= regex which misses these. A generic text-path"
          echo "extraction (regex /vapi/api[0-9]+/... or broader /\\w+/api[0-9]+/\\w+/...) would"
          echo "find them WITHOUT any hardcoded path in registerPaths."
          echo ""
          echo "Next commit: add generic text-path extraction to crawler Step 3, then REMOVE"
          echo "/vapi/api1/user from registerPaths and confirm vAPI still finds IDOR."
          REMOTE_EOF

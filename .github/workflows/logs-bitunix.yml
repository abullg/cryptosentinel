name: Logs Bitunix

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID (optional — if empty, just dump recent PM2 logs)'
        required: false
        default: ''

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Fetch PM2 logs
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          JOB_ID="${{ github.event.inputs.job_id }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 $USER@$HOST "echo '=== PM2 STATUS ==='; pm2 list 2>&1 | head -10; echo; echo '=== PM2 OUT (last 80) ==='; tail -80 /var/log/cryptosentinel/out.log 2>/dev/null; echo; echo '=== PM2 ERR (last 80) ==='; tail -80 /var/log/cryptosentinel/error.log 2>/dev/null; echo; echo '=== Progress files ==='; ls -la /tmp/cs-progress/ 2>/dev/null | head -20; echo; echo '=== Recent progress file contents ==='; for f in \$(ls -t /tmp/cs-progress/*.json 2>/dev/null | head -3); do echo \"--- \$f ---\"; cat \$f 2>/dev/null; echo; done; if [ -n \"$JOB_ID\" ]; then echo \"=== Job $JOB_ID file ===\"; cat /tmp/cs-progress/$JOB_ID.json 2>/dev/null; fi"

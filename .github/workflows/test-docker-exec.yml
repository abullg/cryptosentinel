name: Test Docker Exec

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test containers from inside
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          echo "=== docker exec cs-juice-shop curl localhost:3000 ==="
          docker exec cs-juice-shop curl -s -o /dev/null -w "HTTP=%{http_code} time=%{time_total}s\n" --max-time 5 http://localhost:3000/ 2>&1 || echo "exec failed"
          
          echo "=== docker exec cs-webgoat curl localhost:8080/WebGoat/ ==="
          docker exec cs-webgoat curl -s -o /dev/null -w "HTTP=%{http_code} time=%{time_total}s\n" --max-time 5 http://localhost:8080/WebGoat/ 2>&1 || echo "exec failed"
          
          echo "=== docker exec cs-vampi curl localhost:5000 ==="
          docker exec cs-vampi curl -s -o /dev/null -w "HTTP=%{http_code} time=%{time_total}s\n" --max-time 5 http://localhost:5000/ 2>&1 || echo "exec failed"
          
          echo "=== docker exec cs-vampi curl 127.0.0.1:5000 ==="
          docker exec cs-vampi curl -s -o /dev/null -w "HTTP=%{http_code} time=%{time_total}s\n" --max-time 5 http://127.0.0.1:5000/ 2>&1 || echo "exec failed"
          
          echo "=== ss -tlnp (host listening ports) ==="
          ss -tlnp 2>/dev/null | grep -E ":300[0-9]" | head -20
          
          echo "=== docker inspect cs-vampi networks ==="
          docker inspect cs-vampi --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}: IP={{$v.IPAddress}} GW={{$v.Gateway}}{{"\n"}}{{end}}' 2>&1
          
          echo "=== docker inspect cs-juice-shop networks ==="
          docker inspect cs-juice-shop --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}: IP={{$v.IPAddress}} GW={{$v.Gateway}}{{"\n"}}{{end}}' 2>&1
          
          echo "=== docker network inspect gt_default ==="
          docker network inspect gt_default 2>&1 | head -60
          REMOTE_EOF

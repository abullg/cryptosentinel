name: Check Deployed Code

# Verify that the deployed .next/standalone server.js contains
# the latest source code markers (DEBUG logs, static-first check).

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Grep deployed server.js for our markers
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF' | tee /tmp/check.log
          set -e
          echo "=== Searching for analyze-job route in deployed code ==="

          echo "--- Find ALL .js files in .next (top 30) ---"
          find /opt/cryptosentinel/.next -name "*.js" -type f 2>/dev/null | head -30

          echo ""
          echo "--- List server/app/api directory ---"
          ls -la /opt/cryptosentinel/.next/server/app/api/ 2>/dev/null
          ls -la /opt/cryptosentinel/.next/server/app/api/analyze-job/ 2>/dev/null

          echo ""
          echo "--- Grep 'STATIC-FIRST' in all .js files (recursive, binary too) ---"
          grep -r --include='*.js' --binary-files=text "STATIC-FIRST" /opt/cryptosentinel/.next/ 2>/dev/null | head -3 || echo "  NOT FOUND"

          echo ""
          echo "--- Grep 'DEBUG staticAnalysis' ---"
          grep -r --include='*.js' --binary-files=text "DEBUG staticAnalysis" /opt/cryptosentinel/.next/ 2>/dev/null | head -3 || echo "  NOT FOUND"

          echo ""
          echo "--- Grep 'Static analysis:' (fetch-url) ---"
          grep -r --include='*.js' --binary-files=text "Static analysis:" /opt/cryptosentinel/.next/ 2>/dev/null | head -3 || echo "  NOT FOUND"

          echo ""
          echo "--- Grep 'analyzeWebWithGLM' ---"
          grep -r --include='*.js' --binary-files=text "analyzeWebWithGLM" /opt/cryptosentinel/.next/ 2>/dev/null | head -3 || echo "  NOT FOUND"

          echo ""
          echo "--- Grep 'sourceCode length' (truncation log) ---"
          grep -r --include='*.js' --binary-files=text "sourceCode length" /opt/cryptosentinel/.next/ 2>/dev/null | head -3 || echo "  NOT FOUND"

          echo ""
          echo "--- Grep 'Analysis complete' (final job message) ---"
          grep -r --include='*.js' --binary-files=text "Analysis complete" /opt/cryptosentinel/.next/ 2>/dev/null | head -3 || echo "  NOT FOUND"

          echo ""
          echo "--- PM2 process info ---"
          pm2 describe cryptosentinel 2>&1 | head -20
          echo "=== Done ==="
          REMOTE_EOF

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-code-check
          path: /tmp/check.log
          if-no-files-found: ignore

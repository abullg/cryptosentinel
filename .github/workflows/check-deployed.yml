name: Check Deployed Code

# Verify that the deployed .next/standalone server.js contains
# the latest source code markers (DEBUG logs, static-first check).

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Grep deployed server.js for our markers
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF' | tee /tmp/check.log
          echo "=== FULL listing of /opt/cryptosentinel/ ==="
          ls -la /opt/cryptosentinel/ 2>&1

          echo ""
          echo "=== Find any 'next' or 'standalone' or 'server.js' under /opt/cryptosentinel/ ==="
          find /opt/cryptosentinel/ -maxdepth 4 -name "*.js" -type f 2>&1 | head -30
          find /opt/cryptosentinel/ -maxdepth 4 -name "server.js" 2>&1
          find /opt/cryptosentinel/ -name "ecosystem.config*" 2>&1

          echo ""
          echo "=== Grep 'STATIC-FIRST' in ALL files recursively ==="
          grep -rn "STATIC-FIRST" /opt/cryptosentinel/ --include="*.js" 2>&1 | head -5 || true
          grep -rn "STATIC-FIRST" /opt/cryptosentinel/ --include="*.ts" 2>&1 | head -5 || true

          echo ""
          echo "=== Grep 'DEBUG staticAnalysis' ==="
          grep -rn "DEBUG staticAnalysis" /opt/cryptosentinel/ --include="*.js" 2>&1 | head -5 || true
          grep -rn "DEBUG staticAnalysis" /opt/cryptosentinel/ --include="*.ts" 2>&1 | head -5 || true

          echo ""
          echo "=== PM2 process info ==="
          pm2 describe cryptosentinel 2>&1 | head -25
          echo ""
          echo "=== PM2 last 30 lines of out.log ==="
          tail -30 /var/log/cryptosentinel/out.log 2>&1 | head -30
          echo ""
          echo "=== Done ==="
          REMOTE_EOF

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-code-check
          path: /tmp/check.log
          if-no-files-found: ignore

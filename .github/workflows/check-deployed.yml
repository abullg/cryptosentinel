name: Check Deployed Code

# Verify that the deployed .next/standalone server.js contains
# the latest source code markers (DEBUG logs, static-first check).

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Grep deployed server.js for our markers
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF' | tee /tmp/check.log
          echo "=== Searching for analyze-job route in deployed code ==="

          echo "--- List /opt/cryptosentinel/ ---"
          ls -la /opt/cryptosentinel/ 2>&1 | head -20

          echo ""
          echo "--- List /opt/cryptosentinel/.next/ ---"
          ls -la /opt/cryptosentinel/.next/ 2>&1 | head -20

          echo ""
          echo "--- List /opt/cryptosentinel/.next/standalone/ ---"
          ls -la /opt/cryptosentinel/.next/standalone/ 2>&1 | head -10

          echo ""
          echo "--- List /opt/cryptosentinel/.next/server/ ---"
          ls -la /opt/cryptosentinel/.next/server/ 2>&1 | head -20

          echo ""
          echo "--- List /opt/cryptosentinel/.next/server/app/ ---"
          ls -la /opt/cryptosentinel/.next/server/app/ 2>&1 | head -20

          echo ""
          echo "--- List /opt/cryptosentinel/.next/server/app/api/ ---"
          ls -la /opt/cryptosentinel/.next/server/app/api/ 2>&1 | head -30

          echo ""
          echo "--- List /opt/cryptosentinel/.next/server/app/api/analyze-job/ ---"
          ls -la /opt/cryptosentinel/.next/server/app/api/analyze-job/ 2>&1

          echo ""
          echo "--- Find ALL .js files in .next (top 30) ---"
          find /opt/cryptosentinel/.next -name "*.js" -type f 2>&1 | head -30

          echo ""
          echo "--- Grep 'STATIC-FIRST' in all .js files ---"
          grep -rn --include='*.js' --binary-files=text "STATIC-FIRST" /opt/cryptosentinel/.next/ 2>&1 | head -5 || true

          echo ""
          echo "--- Grep 'DEBUG staticAnalysis' ---"
          grep -rn --include='*.js' --binary-files=text "DEBUG staticAnalysis" /opt/cryptosentinel/.next/ 2>&1 | head -5 || true

          echo ""
          echo "--- Grep 'sourceCode length' (truncation log) ---"
          grep -rn --include='*.js' --binary-files=text "sourceCode length" /opt/cryptosentinel/.next/ 2>&1 | head -5 || true

          echo ""
          echo "--- Grep 'Static analysis:' (fetch-url) ---"
          grep -rn --include='*.js' --binary-files=text "Static analysis:" /opt/cryptosentinel/.next/ 2>&1 | head -5 || true

          echo ""
          echo "--- Grep 'analyzeWebWithGLM' ---"
          grep -rn --include='*.js' --binary-files=text "analyzeWebWithGLM" /opt/cryptosentinel/.next/ 2>&1 | head -5 || true

          echo ""
          echo "=== Done ==="
          REMOTE_EOF

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-code-check
          path: /tmp/check.log
          if-no-files-found: ignore

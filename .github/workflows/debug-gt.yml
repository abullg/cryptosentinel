name: Debug GT Containers

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Debug GT containers on VPS
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          echo "=== docker ps -a (all containers) ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | head -20
          echo ""
          echo "=== docker network ls ==="
          docker network ls
          echo ""
          echo "=== docker network inspect bridge (subnets) ==="
          docker network inspect bridge 2>&1 | grep -E "Subnet|Gateway|Name|Containers" | head -20
          echo ""
          echo "=== docker inspect cs-webgoat (network settings) ==="
          docker inspect cs-webgoat --format '{{json .NetworkSettings.IPAddress}} {{json .NetworkSettings.Ports}}' 2>&1
          echo ""
          echo "=== docker inspect cs-juice-shop ==="
          docker inspect cs-juice-shop --format '{{json .NetworkSettings.IPAddress}} {{json .NetworkSettings.Ports}}' 2>&1
          echo ""
          echo "=== docker inspect cs-vampi ==="
          docker inspect cs-vampi --format '{{json .NetworkSettings.IPAddress}} {{json .NetworkSettings.Ports}}' 2>&1
          echo ""
          echo "=== iptables -L OUTPUT -n -v --line-numbers ==="
          iptables -L OUTPUT -n -v --line-numbers 2>&1 | head -40
          echo ""
          echo "=== iptables -L INPUT -n -v --line-numbers ==="
          iptables -L INPUT -n -v --line-numbers 2>&1 | head -30
          echo ""
          echo "=== iptables -L FORWARD -n -v --line-numbers ==="
          iptables -L FORWARD -n -v --line-numbers 2>&1 | head -30
          echo ""
          echo "=== ip6tables -L OUTPUT -n -v --line-numbers ==="
          ip6tables -L OUTPUT -n -v --line-numbers 2>&1 | head -20
          echo ""
          echo "=== curl each GT port with explicit IPv4 (127.0.0.1) ==="
          for port in 3001 3002 3005 3007 3008 3009; do
            echo "--- 127.0.0.1:$port ---"
            curl -4 -s -o /dev/null -w "HTTP=%{http_code} time=%{time_total}s\n" --max-time 10 http://127.0.0.1:$port/ 2>&1
          done
          echo ""
          echo "=== curl with explicit IPv6 (::1) ==="
          for port in 3001 3002 3005 3007 3008 3009; do
            echo "--- [::1]:$port ---"
            curl -6 -s -o /dev/null -w "HTTP=%{http_code} time=%{time_total}s\n" --max-time 5 "http://[::1]:$port/" 2>&1
          done
          echo ""
          echo "=== docker compose logs (last 10 lines per service) ==="
          cd /opt/cryptosentinel/tests/gt
          for svc in juice-shop dvwa webgoat vampi canary negative-static; do
            echo "--- $svc ---"
            docker compose logs --tail=10 $svc 2>&1 | tail -15
            echo ""
          done
          echo "=== df -h /var/lib/docker ==="
          df -h /var/lib/docker /var / 2>&1 | head -10
          echo ""
          echo "=== free -h ==="
          free -h
          REMOTE_EOF

name: Debug GT Containers

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Debug GT containers on VPS
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          echo "=== docker ps -a (all containers) ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | head -20
          echo ""
          echo "=== docker images ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedSince}}" | head -20
          echo ""
          echo "=== docker compose ls ==="
          cd /opt/cryptosentinel/tests/gt
          docker compose ps 2>&1
          echo ""
          echo "=== docker compose logs (last 20 lines per service) ==="
          for svc in juice-shop dvwa webgoat vampi canary negative-static; do
            echo "--- $svc ---"
            docker compose logs --tail=20 $svc 2>&1 | tail -30
            echo ""
          done
          echo "=== curl each GT port ==="
          for port in 3001 3002 3005 3007 3008 3009; do
            echo "--- localhost:$port ---"
            curl -s -o /dev/null -w "HTTP=%{http_code} time=%{time_total}s\n" --max-time 10 http://localhost:$port/ 2>&1
          done
          echo ""
          echo "=== df -h /var/lib/docker (disk space for images) ==="
          df -h /var/lib/docker /var / 2>&1 | head -10
          echo ""
          echo "=== free -h (memory) ==="
          free -h
          REMOTE_EOF

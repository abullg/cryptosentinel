name: Browser Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Playwright + Chromium
        run: |
          npm init -y
          npm install playwright --silent 2>&1 | tail -3
          npx playwright install chromium --with-deps 2>&1 | tail -5

      - name: Load page in real browser, capture errors + screenshot
        run: |
          cat > test.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const ctx = await browser.newContext({
            ignoreHTTPSErrors: true,
            bypassCSP: true,
            viewport: { width: 1400, height: 900 },
          });
          const page = await ctx.newPage();

          const consoleMsgs = [];
          const pageErrors = [];
          const failedReqs = [];

          page.on('console', m => consoleMsgs.push({ type: m.type(), text: m.text().slice(0, 300) }));
          page.on('pageerror', e => pageErrors.push(String(e).slice(0, 500)));
          page.on('requestfailed', r => failedReqs.push({
            url: r.url(),
            err: r.failure()?.errorText,
          }));

          const targets = [
            'http://187.77.181.127/',
            'http://187.77.181.127:3000/',
          ];

          for (const url of targets) {
            console.log(`\n========== ${url} ==========`);
            try {
              // Use 'domcontentloaded' instead of 'networkidle' —
              // the page has background polling that never lets the
              // network go idle, so 'networkidle' times out.
              const resp = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
              console.log(`HTTP: ${resp?.status()} ${resp?.statusText()}`);
              console.log(`URL after nav: ${page.url()}`);

              // Screenshot IMMEDIATELY — before any timeout
              const fname1 = url.replace(/[^a-z0-9]/gi, '_') + '_dom.png';
              await page.screenshot({ path: fname1, fullPage: false });
              console.log(`DOM screenshot saved: ${fname1}`);

              // Wait for hydration (5s)
              await page.waitForTimeout(5000);

              const title = await page.title();
              console.log(`Title (after 5s wait): ${title}`);

              const bodyText = await page.evaluate(() => document.body.innerText.slice(0, 800));
              console.log(`Body text (first 800): ${bodyText.replace(/\n/g, ' | ')}`);

              const bodyLen = await page.evaluate(() => document.body.innerHTML.length);
              console.log(`Body HTML length: ${bodyLen}`);

              // Check what tabs/buttons are visible
              const tabs = await page.$$eval('[role="tab"], button', els => els.slice(0, 15).map(e => (e.textContent?.trim() || '').slice(0, 30)).filter(Boolean));
              console.log(`First 15 buttons/tabs: ${JSON.stringify(tabs)}`);

              // Check for the Auto-Reg panel
              const autoRegText = await page.evaluate(() => {
                const els = Array.from(document.querySelectorAll('*'));
                const match = els.find(e => /Target Auto-Registration/i.test(e.textContent || ''));
                return match ? match.tagName + ' — VISIBLE' : 'NOT FOUND';
              });
              console.log(`Auto-Reg panel: ${autoRegText}`);

              // Check for cyber-grid background (new UI marker)
              const hasCyberGrid = await page.evaluate(() => {
                const root = document.querySelector('div');
                if (!root) return 'no root div';
                const style = window.getComputedStyle(root);
                return `bg: ${style.backgroundColor}, color: ${style.color}`;
              });
              console.log(`Root style: ${hasCyberGrid}`);

              // Screenshot AFTER hydration
              const fname2 = url.replace(/[^a-z0-9]/gi, '_') + '_hydrated.png';
              await page.screenshot({ path: fname2, fullPage: false });
              console.log(`Hydrated screenshot saved: ${fname2}`);
            } catch (e) {
              console.log(`ERROR: ${String(e).slice(0, 500)}`);
              // Still try to screenshot the error state
              try {
                const ferr = url.replace(/[^a-z0-9]/gi, '_') + '_error.png';
                await page.screenshot({ path: ferr, fullPage: false });
                console.log(`Error screenshot saved: ${ferr}`);
              } catch {}
            }
          }

          console.log('\n========== CONSOLE MESSAGES ==========');
          console.log(JSON.stringify(consoleMsgs.slice(0, 20), null, 2));
          console.log('\n========== PAGE ERRORS ==========');
          console.log(JSON.stringify(pageErrors, null, 2));
          console.log('\n========== FAILED REQUESTS ==========');
          console.log(JSON.stringify(failedReqs.slice(0, 10), null, 2));

          await browser.close();
          EOF
          node test.mjs 2>&1

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: '*.png'
          if-no-files-found: ignore

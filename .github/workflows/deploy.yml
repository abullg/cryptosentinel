name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: 'deploy'
  push:
    branches: [main]

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Validate confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Confirmation mismatch. Type 'deploy' to confirm."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:/tmp/build.db
          OPENROUTER_API_KEY: ''

      - name: Setup SSH (key auth — already installed on VPS)
        id: ssh_port
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          PORT=22
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p $PORT -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          # Test SSH key auth directly (key was installed in earlier deploys)
          echo "Testing SSH key auth on port $PORT..."
          if timeout 15 ssh -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 $USER@$HOST "echo KEY_AUTH_OK"; then
            echo "SSH key auth works!"
          else
            echo "Key auth failed, trying sshpass (password)..."
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            PASS="${{ secrets.VPS_PASS }}"
            if timeout 15 sshpass -p "$PASS" ssh -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o PreferredAuthentications=password -o PubkeyAuthentication=no $USER@$HOST "echo PASS_AUTH_OK"; then
              # Re-install public key via password auth
              PUBKEY=$(ssh-keygen -y -f ~/.ssh/id_ed25519 2>/dev/null)
              sshpass -p "$PASS" ssh -p $PORT -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no $USER@$HOST \
                "mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && grep -qF '$PUBKEY' ~/.ssh/authorized_keys || echo '$PUBKEY' >> ~/.ssh/authorized_keys"
              echo "Public key re-installed via password auth"
            else
              echo "::error::Could not connect to VPS via key or password auth."
              exit 1
            fi
          fi
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "user=$USER" >> "$GITHUB_OUTPUT"

      - name: Sync repo to VPS
        run: |
          PORT=${{ steps.ssh_port.outputs.port }}
          USER=${{ steps.ssh_port.outputs.user }}
          HOST="${{ secrets.VPS_HOST }}"
          REMOTE_DIR="/opt/cryptosentinel"
          ssh -p $PORT -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $USER@$HOST "mkdir -p $REMOTE_DIR"
          rsync -azP --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            -e "ssh -p $PORT -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519" \
            ./ $USER@$HOST:$REMOTE_DIR/

      - name: Install + build + restart on VPS
        run: |
          PORT=${{ steps.ssh_port.outputs.port }}
          USER=${{ steps.ssh_port.outputs.user }}
          HOST="${{ secrets.VPS_HOST }}"
          # Use unquoted heredoc so $REMOTE_DIR is expanded locally before
          # being sent to the remote shell (quoted heredoc sends literal
          # $REMOTE_DIR which is undefined on remote → 'cd $REMOTE_DIR' →
          # falls back to /root → npm ci fails with 'package.json not found').
          REMOTE_DIR="/opt/cryptosentinel"
          ssh -p $PORT -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $USER@$HOST bash -s <<REMOTE_SCRIPT
          set -e
          cd $REMOTE_DIR
          echo "Working dir: \$(pwd)"

          # Ensure persistent data dir
          mkdir -p /data /var/log/cryptosentinel
          chmod 755 /data /var/log/cryptosentinel

          # Install deps (npm — bun.lock removed in audit). NO --omit=dev
          # because the VPS needs to BUILD (next build requires devDeps
          # like @tailwindcss/postcss, prisma, typescript, etc.)
          # Clean stale .next + node_modules from previous failed deploys.
          rm -rf .next node_modules
          npm ci || npm install

          # Verify @tailwindcss/postcss is installed (Turbopack needs it)
          if [ ! -d node_modules/@tailwindcss/postcss ]; then
            echo "@tailwindcss/postcss MISSING — install failed"
            ls -la node_modules/@tailwindcss/ 2>&1 | head -10
            exit 1
          fi
          echo "@tailwindcss/postcss present"

          # Generate Prisma client
          npx prisma generate

          # Build Next.js (ignoreBuildErrors=true per audit fix — codebase
          # has pre-existing TS errors in analyze-ai/route.ts union types)
          NODE_OPTIONS=--max-old-space-size=2048 npx next build

          # Apply DB schema (no --accept-data-loss — audit fix CRIT-7)
          export DATABASE_URL=file:/data/cryptosentinel.db
          npx prisma db push

          # Restart PM2 (audit fix HIGH-1: max_restarts=10)
          if command -v pm2 >/dev/null 2>&1; then
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save
          else
            npm install -g pm2
            pm2 start ecosystem.config.js --env production
            pm2 save
            pm2 startup systemd -u $USER --hp /root 2>&1 | tail -3 || true
          fi

          # Reload Caddy with new config
          if command -v caddy >/dev/null 2>&1; then
            cp Caddyfile /etc/caddy/Caddyfile 2>/dev/null || true
            systemctl reload caddy 2>/dev/null || caddy reload --config Caddyfile 2>/dev/null || true
          fi

          echo "=== Deploy complete ==="
          pm2 list 2>/dev/null || true
          REMOTE_SCRIPT

      - name: Health check
        run: |
          for try in $(seq 1 24); do
            for port in 81 3000 80 443; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 \
                http://${{ secrets.VPS_HOST }}:$port/api/health 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "Health check passed on port $port"
                curl -s http://${{ secrets.VPS_HOST }}:$port/api/health
                exit 0
              fi
            done
            echo "Attempt $try: not yet up, sleeping 5s..."
            sleep 5
          done
          echo "::error::App did not become healthy on any expected port within 2 minutes."
          exit 1

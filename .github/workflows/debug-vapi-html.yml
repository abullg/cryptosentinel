name: Debug vAPI HTML
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Start vAPI + fetch HTML
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          # Start vAPI first (bench-down stopped it)
          echo "=== Starting vAPI ==="
          cd /opt/vapi 2>/dev/null || { echo "vAPI repo not found"; exit 1; }
          docker compose up -d --build 2>&1 | tail -5
          echo "Waiting 30s for MySQL..."
          sleep 30
          echo "=== vAPI container status ==="
          docker compose ps 2>&1 | tail -5
          echo ""
          echo "=== vAPI root HTML (first 3000 chars) ==="
          curl -s --max-time 10 http://127.0.0.1:3011/ | head -c 3000
          echo ""
          echo "=== vAPI /vapi/ HTML (first 3000 chars) ==="
          curl -s --max-time 10 http://127.0.0.1:3011/vapi/ | head -c 3000
          echo ""
          echo "=== All paths found in vAPI root HTML ==="
          curl -s --max-time 10 http://127.0.0.1:3011/ | grep -oE '/[a-zA-Z0-9/_{}.-]+' | sort -u | head -30
          echo ""
          echo "=== All paths found in /vapi/ HTML ==="
          curl -s --max-time 10 http://127.0.0.1:3011/vapi/ | grep -oE '/[a-zA-Z0-9/_{}.-]+' | sort -u | head -30
          echo ""
          echo "=== Try /vapi/api1/user (register A) ==="
          curl -s --max-time 5 -X POST -H "Content-Type: application/json" \
            -d '{"email":"cs_bot_a@test.local","password":"Test12345!"}' \
            http://127.0.0.1:3011/vapi/api1/user
          echo ""
          echo "=== Try /vapi/api1/user (register B) ==="
          curl -s --max-time 5 -X POST -H "Content-Type: application/json" \
            -d '{"email":"cs_bot_b@test.local","password":"Test12345!"}' \
            http://127.0.0.1:3011/vapi/api1/user
          echo ""
          echo "=== Try /vapi/api2/user/login (email field) ==="
          curl -s --max-time 5 -X POST -H "Content-Type: application/json" \
            -d '{"email":"cs_bot_a@test.local","password":"Test12345!"}' \
            http://127.0.0.1:3011/vapi/api2/user/login
          echo ""
          echo "=== Docker logs (last 10) ==="
          docker compose logs --tail 10 www 2>&1
          REMOTE_EOF

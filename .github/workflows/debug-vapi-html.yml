name: Debug vAPI HTML
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Fetch vAPI root HTML
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          echo "=== vAPI root HTML (first 2000 chars) ==="
          curl -s --max-time 10 http://127.0.0.1:3011/ | head -c 2000
          echo ""
          echo "=== vAPI /vapi/ HTML (first 2000 chars) ==="
          curl -s --max-time 10 http://127.0.0.1:3011/vapi/ | head -c 2000
          echo ""
          echo "=== All paths found in vAPI HTML ==="
          curl -s --max-time 10 http://127.0.0.1:3011/ | grep -oE '/vapi/[a-zA-Z0-9/_{}-]+' | sort -u | head -20
          echo "=== Try /vapi/api1/user (register) ==="
          curl -s --max-time 5 -X POST -H "Content-Type: application/json" \
            -d '{"email":"cs_bot@test.local","password":"Test12345!"}' \
            http://127.0.0.1:3011/vapi/api1/user
          echo ""
          echo "=== Try /vapi/api2/user/login ==="
          curl -s --max-time 5 -X POST -H "Content-Type: application/json" \
            -d '{"email":"cs_bot@test.local","password":"Test12345!"}' \
            http://127.0.0.1:3011/vapi/api2/user/login
          echo ""
          REMOTE_EOF

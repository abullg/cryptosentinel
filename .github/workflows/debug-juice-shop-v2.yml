name: Debug Juice Shop v2

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Try Claude's diagnostic commands
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF' | tee /tmp/debug2.log
          echo "=== 1. curl -v --http1.1 http://127.0.0.1:3001/ ==="
          curl -v --http1.1 --max-time 10 http://127.0.0.1:3001/ 2>&1 | head -30

          echo ""
          echo "=== 2. curl http://127.0.0.1:3001/api/health ==="
          curl -s --max-time 10 http://127.0.0.1:3001/api/health 2>&1 | head -5
          echo "Exit: $?"

          echo ""
          echo "=== 3. curl http://127.0.0.1:3001/rest/products/search ==="
          curl -s --max-time 10 http://127.0.0.1:3001/rest/products/search 2>&1 | head -5
          echo "Exit: $?"

          echo ""
          echo "=== 4. curl -v -H 'Host: localhost:3001' http://127.0.0.1:3001/rest/products/search ==="
          curl -s --max-time 10 -H 'Host: localhost:3001' http://127.0.0.1:3001/rest/products/search 2>&1 | head -5
          echo "Exit: $?"

          echo ""
          echo "=== 5. docker exec curl inside container ==="
          docker exec cs-juice-shop curl -s --max-time 10 http://localhost:3000/api/health 2>&1 | head -5
          echo "Exit: $?"

          echo ""
          echo "=== 6. Container IP + direct curl ==="
          CONTAINER_IP=$(docker inspect cs-juice-shop --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' 2>/dev/null)
          echo "Container IP: $CONTAINER_IP"
          if [ -n "$CONTAINER_IP" ]; then
            curl -s --max-time 10 "http://$CONTAINER_IP:3000/api/health" 2>&1 | head -5
            echo "Exit: $?"
          fi

          echo ""
          echo "=== 7. docker logs last 10 ==="
          docker logs cs-juice-shop --tail 10 2>&1

          echo ""
          echo "=== DONE ==="
          REMOTE_EOF

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-juice-shop-v2
          path: /tmp/debug2.log
          if-no-files-found: ignore

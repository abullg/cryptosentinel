name: Fix Static Assets

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy static assets to standalone + restart PM2
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 $USER@$HOST "cd /opt/cryptosentinel && echo '=== BEFORE ===' && ls -la .next/standalone/.next/static/ 2>&1 | head -5 && echo '=== COPYING STATIC ASSETS ===' && mkdir -p .next/standalone/.next && cp -rf .next/static .next/standalone/.next/ && echo '=== AFTER ===' && ls -la .next/standalone/.next/static/chunks/ 2>&1 | head -10 && echo '=== TEST JS BUNDLE ===' && curl -s -o /dev/null -w 'HTTP %{http_code}' http://localhost:3000/_next/static/chunks/ 2>&1 && echo '' && echo '=== RESTART PM2 ===' && pm2 restart cryptosentinel 2>&1 | tail -5 && sleep 5 && echo '=== TEST HOMEPAGE ===' && curl -sI --max-time 10 http://localhost:3000/ 2>&1 | head -3 && echo '=== TEST JS BUNDLE AFTER RESTART ===' && JS_URL=\$(curl -s http://localhost:3000/ | grep -oE 'src=\"[^\"]+\\.js[^\"]*\"' | head -1 | sed 's/src=\"//;s/\"//') && echo \"Testing: \$JS_URL\" && curl -s -o /dev/null -w 'HTTP %{http_code}' --max-time 5 \"http://localhost:3000\$JS_URL\" 2>&1 && echo '' && echo '=== DONE ==='"

name: Fix Middleware

on:
  workflow_dispatch:

jobs:
  fix:
    name: Rename middleware.ts to proxy.ts (Next 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          HOST="${{ secrets.VPS_HOST }}"
          ssh-keyscan -p 22 -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rename middleware to proxy + rebuild + restart
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          PORT=22
          ssh -p $PORT -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $USER@$HOST bash -s <<'FIX'
          set -e
          cd /opt/cryptosentinel

          echo "=== 1. Check current middleware file ==="
          ls -la src/middleware.ts 2>&1 || echo "No middleware.ts"
          ls -la src/proxy.ts 2>&1 || echo "No proxy.ts"

          echo ""
          echo "=== 2. Rename middleware.ts to proxy.ts (Next 16 convention) ==="
          if [ -f src/middleware.ts ] && [ ! -f src/proxy.ts ]; then
            mv src/middleware.ts src/proxy.ts
            echo "Renamed."
          else
            echo "Already renamed or missing."
          fi
          ls -la src/proxy.ts 2>&1

          echo ""
          echo "=== 3. Also rename in source repo (so next deploy keeps it) ==="
          cd /opt/cryptosentinel
          if [ -f src/middleware.ts ] || true; then
            # We're in the deploy dir, but the git repo is also here.
            # Just rename the file - git will track it next deploy.
            git status 2>&1 | head -5 || echo "Not a git repo"
          fi

          echo ""
          echo "=== 4. Clean .next + rebuild ==="
          rm -rf .next
          export NODE_OPTIONS=--max-old-space-size=2048
          npx next build 2>&1 | tail -20

          echo ""
          echo "=== 5. Restart PM2 ==="
          pm2 delete cryptosentinel 2>&1 | tail -2
          set -a; . /etc/cryptosentinel.env 2>/dev/null; set +a
          pm2 start ecosystem.config.js --env production 2>&1 | tail -5
          pm2 save 2>&1 | tail -2
          sleep 8

          echo ""
          echo "=== 6. Test endpoints ==="
          for path in /api/health /api/login /api/test-key /api/settings /; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 http://localhost:3000$path 2>/dev/null || echo "000")
            echo "  $path -> HTTP $CODE"
          done

          echo ""
          echo "=== 7. Detailed /api/health response ==="
          curl -sv --max-time 10 http://localhost:3000/api/health 2>&1 | tail -30

          echo ""
          echo "=== DONE ==="
          FIX

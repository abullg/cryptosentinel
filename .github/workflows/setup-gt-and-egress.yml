name: Setup GT + Egress Allowlist

# Per Claude protocol (§7, §9.16, §9.30, §9.31):
#   - Self-host GT in docker on VPS (juice-shop, dvwa, wrongsecrets, crAPI, webgoat, canary)
#   - Egress allowlist: deny outbound from analyze-job except for
#     * tcp 80,443 to fetch-url (with jina WAF bypass)
#     * localhost:3001-3008 (GT containers)
#     * DENY all other — prevent prompt-injection-driven SSRF to attacker hosts
#   - This is a P0 security fix before any production deploy:
#     target HTML is fed to GLM, GLM generates validationSteps, our server
#     executes them. Without egress allowlist, this is RCE/SSRF class of
#     own system. (see tests/gt/canary/prompt-injection.html)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pull GT docker-compose + bring up containers
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          set -e
          cd /opt/cryptosentinel
          git pull --ff-only
          cd tests/gt
          echo "=== docker compose version ==="
          docker compose version

          # ─── EXPLICIT IMAGE PULL (per service) ───
          # Previously: docker compose pull --ignore-pull-failures silently skipped
          # failures. WebGoat (350MB) and Juice Shop got skipped, containers never
          # started. Now: pull each image individually with explicit error reporting.
          echo "=== Pulling GT images individually ==="
          for img in \
            "bkimminich/juice-shop:v18.0.0" \
            "vulnerables/web-dvwa:latest" \
            "webgoat/webgoat:latest" \
            "nginx:alpine"; do
            echo "--- Pulling $img ---"
            if ! docker pull "$img"; then
              echo "⚠ FAILED to pull $img — continuing (container may fail to start)"
            fi
          done

          # VAmPI is built from local Dockerfile — needs docker compose build
          echo "=== Building VAmPI image from local Dockerfile ==="
          docker compose build vampi || echo "⚠ VAmPI build failed — continuing"

          echo "=== Bringing up GT containers ==="
          docker compose up -d --no-deps --build
          echo "=== Waiting for GT containers to be READY (extended healthcheck loop) ==="
          # WebGoat Spring Boot needs ~90s startup. Juice Shop Node.js ~60s.
          # Loop up to 5 min (60 attempts × 5s).
          for i in $(seq 1 60); do
            echo "  attempt $i/60 ($(date +%H:%M:%S))..."
            sleep 5
            # Check ALL GT ports
            ALL_OK=true
            for port in 3001 3002 3005 3007 3008 3009; do
              CODE=$(curl -s --max-time 5 -o /dev/null -w "%{http_code}" http://localhost:$port/ 2>/dev/null || echo "000")
              if ! echo "$CODE" | grep -qE '^[23][0-9][0-9]$'; then
                ALL_OK=false
                echo "    port $port: $CODE (not ready yet)"
              fi
            done
            if [ "$ALL_OK" = "true" ]; then
              echo "  ✓ All GT containers are ready!"
              break
            fi
          done
          echo "=== GT container status ==="
          docker compose ps
          echo "=== Health check: curl each GT port ==="
          for port in 3001 3002 3005 3007 3008 3009; do
            echo "--- localhost:$port ---"
            curl -sI --max-time 10 http://localhost:$port/ | head -1 || echo "FAIL"
          done
          echo "=== DONE GT setup ==="
          REMOTE_EOF

      - name: Apply egress allowlist (iptables)
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF'
          set -e
          echo "=== CURRENT iptables OUTPUT chain ==="
          iptables -L OUTPUT -n --line-numbers | head -30

          # Idempotent: only add if not already present (check by comment match)
          if iptables -C OUTPUT -m comment --comment "cs-egress-allow-http" -p tcp --dport 80 -j ACCEPT 2>/dev/null; then
            echo "egress rules already applied — skipping"
          else
            echo "=== Applying CryptoSentinel egress allowlist ==="

            # Allow loopback (localhost) — GT containers + Next.js internal
            iptables -A OUTPUT -o lo -j ACCEPT -m comment --comment "cs-egress-allow-loopback"

            # Allow established connections (response traffic for inbound requests)
            iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT -m comment --comment "cs-egress-allow-established"

            # Allow DNS (UDP/TCP 53)
            iptables -A OUTPUT -p udp --dport 53 -j ACCEPT -m comment --comment "cs-egress-allow-dns-udp"
            iptables -A OUTPUT -p tcp --dport 53 -j ACCEPT -m comment --comment "cs-egress-allow-dns-tcp"

            # Allow HTTP/HTTPS for fetch-url (target scanning + jina.ai WAF bypass)
            iptables -A OUTPUT -p tcp --dport 80 -j ACCEPT -m comment --comment "cs-egress-allow-http"
            iptables -A OUTPUT -p tcp --dport 443 -j ACCEPT -m comment --comment "cs-egress-allow-https"

            # Allow SSH (for management)
            iptables -A OUTPUT -p tcp --dport 22 -j ACCEPT -m comment --comment "cs-egress-allow-ssh"

            # Allow NTP
            iptables -A OUTPUT -p udp --dport 123 -j ACCEPT -m comment --comment "cs-egress-allow-ntp"

            # Allow GT docker ports (3001-3008) — Docker port-forwarded traffic
            # goes through docker0 after DNAT, not lo. Without this, the REJECT
            # rule blocks all GT container access (juice-shop, dvwa, canary, negative).
            for gt_port in 3001 3002 3003 3004 3005 3006 3007 3008 3009; do
              iptables -A OUTPUT -p tcp --dport $gt_port -j ACCEPT -m comment --comment "cs-egress-allow-gt-port-$gt_port"
            done

            # Allow HTTPS to github.com (for git pull, deps)
            # (covered by 443 above)

            # DENY everything else — this is the prompt-injection defense
            # If GLM generates validationSteps with URL to attacker.test,
            # evil.example, internal-ssrf-target.test (see canary page),
            # this rule blocks the probe.
            iptables -A OUTPUT -j REJECT -m comment --comment "cs-egress-deny-default"

            echo "=== egress rules applied ==="
          fi

          # ─── GT PORT RULES (always applied — separate from main block) ───
          # These MUST be added BEFORE the REJECT rule. Since the main block
          # above might be skipped (idempotency check), we add GT port rules
          # separately with their own idempotency check.
          for gt_port in 3001 3002 3003 3004 3005 3007 3008 3009; do
            if ! iptables -C OUTPUT -p tcp --dport $gt_port -j ACCEPT -m comment --comment "cs-egress-allow-gt-port-$gt_port" 2>/dev/null; then
              echo "Adding GT port $gt_port to allowlist"
              iptables -I OUTPUT 1 -p tcp --dport $gt_port -j ACCEPT -m comment --comment "cs-egress-allow-gt-port-$gt_port"
            fi
          done
          echo "=== GT port rules ensured ==="

          echo "=== UPDATED iptables OUTPUT chain ==="
          iptables -L OUTPUT -n --line-numbers

          echo "=== Saving iptables (persistent across reboot) ==="
          if command -v netfilter-persistent >/dev/null; then
            netfilter-persistent save
          elif command -v iptables-save >/dev/null; then
            iptables-save > /etc/iptables/rules.v4 2>/dev/null || iptables-save > /etc/iptables.rules
            echo "saved to /etc/iptables/rules.v4 or /etc/iptables.rules"
          else
            echo "WARNING: no persistence tool found — rules will be lost on reboot"
          fi

          echo "=== DONE egress allowlist ==="
          REMOTE_EOF

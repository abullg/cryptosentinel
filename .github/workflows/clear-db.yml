name: Clear Database

on:
  workflow_dispatch:

jobs:
  clear:
    name: Clear all projects/vulns/contracts from DB
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          HOST="${{ secrets.VPS_HOST }}"
          ssh-keyscan -p 22 -H $HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Clear database via API
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          PORT=22
          ssh -p $PORT -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $USER@$HOST bash -s <<'CLEAR'
          echo "=== Clearing database ==="
          # Call the /api/vulnerabilities endpoint with action=clear-all
          # This deletes: vulnerabilities, contracts, audits, jobs, memoryPatterns, projects, settings
          RESULT=$(curl -s --max-time 30 -X POST http://localhost:3000/api/vulnerabilities \
            -H 'Content-Type: application/json' \
            -d '{"action":"clear-all"}')
          echo "Result: $RESULT"

          echo ""
          echo "=== Verify cleared ==="
          PROJECTS=$(curl -s --max-time 10 http://localhost:3000/api/projects | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "?")
          VULNS=$(curl -s --max-time 10 http://localhost:3000/api/vulnerabilities | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "?")
          echo "Projects remaining: $PROJECTS"
          echo "Vulnerabilities remaining: $VULNS"

          echo ""
          echo "=== Restart PM2 (fresh state) ==="
          pm2 restart cryptosentinel 2>&1 | tail -3
          sleep 3
          echo "=== DONE ==="
          CLEAR

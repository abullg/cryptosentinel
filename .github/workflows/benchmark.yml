name: Benchmark (Claude Audit Protocol)

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Clear DB + ensure GT env + run benchmark
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER || 'root' }}"
          ssh -p 22 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=200 -i ~/.ssh/id_ed25519 $USER@$HOST "bash -s" <<'REMOTE_EOF' | tee /tmp/benchmark_output.txt
          set -e
          cd /opt/cryptosentinel
          git pull --ff-only

          # ─── DB CLEAR (per Claude §9 — prevent cumulative pollution) ───
          # Previously: /api/vulnerabilities returned ALL findings from ALL
          # previous benches. "2 confirmed" reflected v1 leftovers, not this
          # bench's per-job count. Now we clear DB before each bench.
          echo "=== Clearing DB (Vulnerability table) ==="
          # Install sqlite3 if not already installed (was missing on VPS!)
          # Caused DB clear to silently fail → previous bench's findings
          # polluted new bench → active fuzzer's hashSig collisions caused
          # new findings to be silently skipped → "0 confirmed" reported
          if ! command -v sqlite3 >/dev/null 2>&1; then
            echo "Installing sqlite3..."
            apt-get install -y sqlite3 2>&1 | tail -3 || echo "apt install failed — trying alternative"
          fi
          command -v sqlite3 && echo "✓ sqlite3 available" || echo "⚠ sqlite3 still not available"

          # Search common DB locations — may be at /opt/cryptosentinel, /data,
          # or in prisma dev sqlite. Use broader search.
          DB_FILE=$(find /opt/cryptosentinel /data /var/lib/cryptosentinel -name "*.db" -type f 2>/dev/null | head -1)
          # Also try prisma default location
          if [ -z "$DB_FILE" ]; then
            DB_FILE=$(find /opt/cryptosentinel -name "dev.db" -o -name "cryptosentinel.db" -o -name "app.db" 2>/dev/null | head -1)
          fi
          # Also check DATABASE_URL env from PM2
          if [ -z "$DB_FILE" ]; then
            DB_URL=$(pm2 env 2>/dev/null | grep -i DATABASE_URL | head -1 | sed -E 's/.*=file://?([^"]+).*/\1/' || true)
            DB_FILE="${DB_URL#file:}"
          fi
          if [ -n "$DB_FILE" ] && [ -f "$DB_FILE" ]; then
            echo "DB file: $DB_FILE"
            # Use sqlite3 if available, otherwise use node + prisma
            if command -v sqlite3 >/dev/null 2>&1; then
              sqlite3 "$DB_FILE" "DELETE FROM Vulnerability;" 2>&1 || echo "Vulnerability table clear failed"
              sqlite3 "$DB_FILE" "DELETE FROM AnalysisJob;" 2>&1 || true
              sqlite3 "$DB_FILE" "DELETE FROM Audit;" 2>&1 || true
              sqlite3 "$DB_FILE" "DELETE FROM Contract;" 2>&1 || true
              sqlite3 "$DB_FILE" "DELETE FROM Project;" 2>&1 || true
              echo "DB cleared via sqlite3"
            else
              # Fallback: use node + prisma to clear DB
              echo "sqlite3 unavailable — using node + prisma to clear DB"
              cd /opt/cryptosentinel
              node -e "
                const { PrismaClient } = require('@prisma/client');
                const p = new PrismaClient();
                Promise.all([
                  p.vulnerability.deleteMany(),
                  p.analysisJob.deleteMany(),
                  p.audit.deleteMany(),
                  p.contract.deleteMany(),
                  p.project.deleteMany(),
                ]).then(() => { console.log('DB cleared via prisma'); return p.\$disconnect(); })
                  .catch(e => { console.error('prisma clear failed:', e.message); process.exit(1); });
              " 2>&1 || echo "node prisma clear failed"
            fi
          else
            echo "WARNING: No .db file found — skipping clear"
            echo "  Looked in: /opt/cryptosentinel, /data, /var/lib/cryptosentinel"
            echo "  Also tried: dev.db, cryptosentinel.db, app.db"
            # Try pm2 logs for DATABASE_URL
            echo "  PM2 process env:"
            pm2 env 2>/dev/null | grep -i "DATABASE_URL\|DB_PATH" | head -3 || echo "  (no DATABASE_URL in pm2 env)"
          fi

          # ─── ENABLE GT_ALLOWLIST (for localhost GT docker containers) ───
          # Per Claude §9.30: GT is self-hosted in docker (localhost:3001-3008)
          # Egress iptables allowlist (already applied) provides backup defense
          # against prompt-injection-driven SSRF.
          echo "=== Setting GT_ALLOWLIST_ENABLED=true for PM2 process ==="
          # Try ecosystem.config.js (not .cjs — file extension matters!)
          for ECOSYSTEM_FILE in /opt/cryptosentinel/ecosystem.config.js /opt/cryptosentinel/ecosystem.config.cjs; do
            if [ -f "$ECOSYSTEM_FILE" ]; then
              if ! grep -q "GT_ALLOWLIST_ENABLED" "$ECOSYSTEM_FILE"; then
                echo "Adding GT_ALLOWLIST_ENABLED to $ECOSYSTEM_FILE"
                sed -i 's/env: {/env: {\n        GT_ALLOWLIST_ENABLED: "true",/' "$ECOSYSTEM_FILE"
              fi
              echo "Verified GT_ALLOWLIST_ENABLED in $ECOSYSTEM_FILE:"
              grep "GT_ALLOWLIST_ENABLED" "$ECOSYSTEM_FILE"
              break
            fi
          done

          # Restart PM2 to pick up env change
          echo "=== Restarting PM2 ==="
          pm2 restart cryptosentinel --update-env 2>&1 | tail -5
          sleep 3
          pm2 list 2>&1 | head -5

          # ─── RUN BENCHMARK ───
          echo "=== Running benchmark.js ==="
          GT_ALLOWLIST_ENABLED=true node scripts/benchmark.js http://localhost:3000 2>&1

          # ─── BENCH-DOWN: stop GT containers after bench (per Claude v8 Q10) ───
          # GT containers should NOT live on production VPS that scans
          # client targets. After bench completes, stop them.
          # Future: move GT to separate staging VPS (Claude Q10 option b).
          echo "=== Bench-down: stopping GT containers ==="
          cd /opt/cryptosentinel/tests/gt
          docker compose stop 2>&1 | tail -5
          echo "  GT containers stopped (not removed — use 'docker compose start' to resume)"
          docker compose ps 2>&1 | tail -5
          REMOTE_EOF

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/benchmark_output.txt
